<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLX Gear — Control</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0A0A0C;
    --panel: #141417;
    --panel2: #1C1C20;
    --line: rgba(255,255,255,0.08);
    --line2: rgba(255,255,255,0.14);
    --text: #F5F5F7;
    --text-dim: rgba(245,245,247,0.55);
    --text-faint: rgba(245,245,247,0.3);
    --accent: #4CC9F0;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --radius: 10px;
    --idle: #6b7280;
    --in_use: #4CC9F0;
    --on_set: #9b5de5;
    --borrowed: #f4a261;
    --damaged: #FF4444;
    --repaired: #06D6A0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  input, select, textarea {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; outline: none; width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--line2); }
  button { cursor: pointer; border: none; background: none; }

  /* ---- LOGIN ---- */
  #login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
  }
  #login-screen .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: var(--text-dim); }
  #login-box { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  #login-box button.primary {
    background: var(--accent); color: #001217; font-weight: 600; padding: 10px; border-radius: 8px; margin-top: 4px;
  }
  #login-error { color: var(--damaged); font-size: 12.5px; min-height: 16px; }

  /* ---- SHELL ---- */
  #app { display: none; height: 100vh; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; gap: 16px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  #topbar .wordmark { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; white-space: nowrap; }
  #topbar .wordmark span { color: var(--accent); }
  #search { max-width: 320px; }
  #topbar .spacer { flex: 1; }
  #user-email { color: var(--text-dim); font-size: 12.5px; }
  #signout { color: var(--text-dim); font-size: 12.5px; padding: 6px 10px; border-radius: 6px; }
  #signout:hover { background: var(--panel2); color: var(--text); }

  #filters {
    display: flex; gap: 8px; padding: 12px 22px; border-bottom: 1px solid var(--line);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .pill {
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--line); color: var(--text-dim); display: flex; align-items: center; gap: 6px;
  }
  .pill.active { border-color: var(--line2); color: var(--text); background: var(--panel2); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }

  #main { flex: 1; overflow: hidden; display: flex; position: relative; }
  #table-wrap { flex: 1; overflow-y: auto; padding: 0 22px 100px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: var(--bg); text-align: left; font-size: 11.5px;
    color: var(--text-faint); font-weight: 600; padding: 14px 10px 8px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--line);
  }
  thead th:hover { color: var(--text-dim); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--panel); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  td.serial { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); letter-spacing: 0.3px; }
  td.name { font-weight: 500; }
  td.dim { color: var(--text-dim); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; background: var(--panel2);
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; }

  #empty-state { padding: 60px 20px; text-align: center; color: var(--text-faint); }

  /* ---- FAB ---- */
  #fab {
    position: fixed; bottom: 28px; right: 28px; width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #001217; font-size: 26px; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 6px 24px rgba(76,201,240,0.35); z-index: 20;
  }
  #fab:active { transform: scale(0.94); }

  /* ---- SLIDE-OVER ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; display: none;
  }
  #panel {
    position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--line); z-index: 31;
    transform: translateX(100%); transition: transform 0.25s ease; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #overlay.show { display: block; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  .panel-header .serial-big { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
  .panel-close { width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .panel-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .field-label { font-size: 11.5px; color: var(--text-faint); font-weight: 600; margin-bottom: 5px; display: block; }
  .status-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-choice {
    padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--line); color: var(--text-dim); display: flex; align-items: center; gap: 6px;
  }
  .status-choice.active { border-color: var(--line2); color: var(--text); background: var(--panel2); }
  .panel-footer { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .btn { padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13.5px; flex: 1; text-align: center; }
  .btn.primary { background: var(--accent); color: #001217; }
  .btn.ghost { background: var(--panel2); color: var(--text); }
  .btn.danger { background: rgba(255,68,68,0.12); color: var(--damaged); }
  #event-log { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .event-row { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; gap: 10px; }

  /* ---- MODAL (Add Item) ---- */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: none;
    align-items: center; justify-content: center;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 460px; max-width: 92vw;
    max-height: 86vh; overflow-y: auto; padding: 24px;
  }
  #modal h2 { font-size: 17px; margin-bottom: 18px; }
  .form-row { margin-bottom: 12px; }
  .form-row.two { display: flex; gap: 10px; }
  .form-row.two > div { flex: 1; }
  #serial-preview-box {
    font-family: var(--mono); font-size: 13px; color: var(--accent); background: var(--panel2);
    border: 1px dashed var(--line2); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  #add-new-toggle { font-size: 12px; color: var(--accent); margin-top: 4px; display: inline-block; }
  .code-add-btn {
    width: 38px; flex-shrink: 0; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; font-size: 16px; color: var(--text-dim);
  }
  .code-add-btn:hover { color: var(--text); border-color: var(--line2); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="wordmark">MLX <span style="color:var(--accent)">GEAR</span> — Control</div>
  <div id="login-box">
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <div id="login-error"></div>
    <button class="primary" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="wordmark">MLX <span>GEAR</span></div>
    <input id="search" placeholder="Search serial or name…" oninput="renderTable()">
    <div class="spacer"></div>
    <div id="user-email"></div>
    <button id="signout" onclick="doLogout()">Sign out</button>
  </div>
  <div id="filters"></div>
  <div id="main">
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="setSort('serial')">Serial</th>
            <th onclick="setSort('name')">Item</th>
            <th onclick="setSort('category')">Category</th>
            <th onclick="setSort('status')">Status</th>
            <th onclick="setSort('purchase_date')">Purchased</th>
            <th onclick="setSort('price')">Price</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="empty-state" style="display:none">No items match this view.</div>
    </div>
  </div>
  <button id="fab" onclick="openAddModal()">+</button>
</div>

<!-- Slide-over detail panel -->
<div id="overlay" onclick="closePanel()"></div>
<div id="panel">
  <div class="panel-header">
    <div>
      <div class="serial-big" id="p-serial"></div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div>
      <span class="field-label">Item</span>
      <div id="p-name" style="font-size:16px;font-weight:600"></div>
    </div>
    <div>
      <span class="field-label">Status</span>
      <div class="status-row" id="p-status-row"></div>
    </div>
    <div class="form-row">
      <span class="field-label">Purchase date</span>
      <input id="p-purchase-date" type="date">
    </div>
    <div class="form-row">
      <span class="field-label">Price (CZK)</span>
      <input id="p-price" type="number">
    </div>
    <div class="form-row">
      <span class="field-label">Condition</span>
      <input id="p-condition" placeholder="e.g. Good, minor scuffs">
    </div>
    <div class="form-row">
      <span class="field-label">Notes</span>
      <textarea id="p-notes" rows="3"></textarea>
    </div>
    <div>
      <span class="field-label">History</span>
      <div id="event-log"></div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn ghost" onclick="closePanel()">Cancel</button>
    <button class="btn primary" onclick="saveItem()">Save changes</button>
  </div>
</div>

<!-- Add Item modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Add item</h2>
    <div class="form-row two">
      <div>
        <span class="field-label">Category</span>
        <div style="display:flex;gap:6px">
          <select id="m-category" onchange="updateSerialPreview()"></select>
          <button type="button" class="code-add-btn" onclick="addNewCode('category')" title="Add new category code">+</button>
        </div>
      </div>
      <div>
        <span class="field-label">Type</span>
        <div style="display:flex;gap:6px">
          <select id="m-type" onchange="updateSerialPreview()"></select>
          <button type="button" class="code-add-btn" onclick="addNewCode('type')" title="Add new type code">+</button>
        </div>
      </div>
      <div>
        <span class="field-label">Brand</span>
        <div style="display:flex;gap:6px">
          <select id="m-brand" onchange="updateSerialPreview()"></select>
          <button type="button" class="code-add-btn" onclick="addNewCode('brand')" title="Add new brand code">+</button>
        </div>
      </div>
    </div>
    <div class="form-row two">
      <div>
        <span class="field-label">Model code (2–3 char)</span>
        <input id="m-model-code" maxlength="3" placeholder="e.g. P6" oninput="updateSerialPreview()">
      </div>
      <div>
        <span class="field-label">Display name</span>
        <input id="m-display-name" placeholder="e.g. Blackmagic Pocket 6K">
      </div>
    </div>
    <div id="serial-preview-box">Serial will generate on save</div>
    <div class="form-row two">
      <div>
        <span class="field-label">Purchase date</span>
        <input id="m-purchase-date" type="date">
      </div>
      <div>
        <span class="field-label">Price (CZK)</span>
        <input id="m-price" type="number">
      </div>
    </div>
    <div class="form-row">
      <span class="field-label">Condition</span>
      <input id="m-condition" placeholder="e.g. New">
    </div>
    <div class="form-row">
      <span class="field-label">Notes</span>
      <textarea id="m-notes" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn primary" onclick="submitNewItem()">Generate & add</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = "https://depprbklgspiawqhnuev.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lVIYRLl-dosIn7XvKWrxOg_PC3oT7t-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_META = {
  idle:      { label: "Idle",      color: "var(--idle)" },
  in_use:    { label: "In use",    color: "var(--in_use)" },
  on_set:    { label: "On set",    color: "var(--on_set)" },
  borrowed:  { label: "Borrowed",  color: "var(--borrowed)" },
  damaged:   { label: "Damaged",   color: "var(--damaged)" },
  repaired:  { label: "Repaired",  color: "var(--repaired)" },
};
const STARTER_CATEGORIES = { C: "Camera", L: "Lens", W: "Wireless", P: "Power", G: "Grip", T: "Tripod/Support", I: "Illumination", A: "Audio" };
const STARTER_TYPES = { C: "Cinema", M: "Mirrorless", P: "Prime", Z: "Zoom" };
const STARTER_BRANDS = { A: "ARRI", B: "Blackmagic", C: "Canon", S: "Sony", F: "Fujifilm", R: "RED", P: "Panasonic", N: "Nikon", D: "DJI", Z: "Zeiss", G: "Sigma", T: "Teradek" };

let items = [];
let activeStatusFilter = null;
let sortField = "serial";
let sortDir = 1;
let panelItemId = null;

// ============================================================
// AUTH
// ============================================================
async function doLogin() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  enterApp(data.session);
}
async function doLogout() {
  await sb.auth.signOut();
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
}
async function enterApp(session) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("user-email").textContent = session.user.email;
  renderFilters();
  await loadItems();
}
async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) enterApp(data.session);
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadItems() {
  const { data, error } = await sb
    .from("items")
    .select("id, serial, unit_id, purchase_date, price, condition, notes, photo_url, status, created_at, model_registry(id, category, type, brand, model_code, display_name, spec_json)");
  if (error) { console.error(error); return; }
  items = (data || []).map(i => ({
    ...i,
    name: i.model_registry?.display_name || "(unknown model)",
    category: i.model_registry?.category || "",
  }));
  renderTable();
}

// ============================================================
// FILTERS
// ============================================================
function renderFilters() {
  const el = document.getElementById("filters");
  const all = `<button class="pill${activeStatusFilter===null?' active':''}" onclick="setFilter(null)">All</button>`;
  const pills = Object.entries(STATUS_META).map(([key, m]) =>
    `<button class="pill${activeStatusFilter===key?' active':''}" onclick="setFilter('${key}')"><span class="dot" style="background:${m.color}"></span>${m.label}</button>`
  ).join("");
  el.innerHTML = all + pills;
}
function setFilter(status) { activeStatusFilter = status; renderFilters(); renderTable(); }
function setSort(field) {
  if (sortField === field) sortDir *= -1; else { sortField = field; sortDir = 1; }
  renderTable();
}

// ============================================================
// TABLE RENDER
// ============================================================
function renderTable() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = items.filter(i => {
    if (activeStatusFilter && i.status !== activeStatusFilter) return false;
    if (q && !(i.serial.toLowerCase().includes(q) || i.name.toLowerCase().includes(q))) return false;
    return true;
  });
  rows.sort((a, b) => {
    let av = a[sortField] ?? "", bv = b[sortField] ?? "";
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });
  const body = document.getElementById("table-body");
  const empty = document.getElementById("empty-state");
  if (rows.length === 0) { body.innerHTML = ""; empty.style.display = "block"; return; }
  empty.style.display = "none";
  body.innerHTML = rows.map(i => {
    const sm = STATUS_META[i.status] || STATUS_META.idle;
    return `<tr onclick="openPanel('${i.id}')">
      <td class="serial">${i.serial}</td>
      <td class="name">${escapeHtml(i.name)}</td>
      <td class="dim">${escapeHtml(i.category)}</td>
      <td><span class="status-pill"><span class="dot" style="background:${sm.color}"></span>${sm.label}</span></td>
      <td class="dim">${i.purchase_date || "—"}</td>
      <td class="dim">${i.price ? i.price + " Kč" : "—"}</td>
    </tr>`;
  }).join("");
}
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ============================================================
// SLIDE-OVER PANEL
// ============================================================
async function openPanel(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  panelItemId = id;
  document.getElementById("p-serial").textContent = item.serial;
  document.getElementById("p-name").textContent = item.name;
  document.getElementById("p-purchase-date").value = item.purchase_date || "";
  document.getElementById("p-price").value = item.price || "";
  document.getElementById("p-condition").value = item.condition || "";
  document.getElementById("p-notes").value = item.notes || "";
  const statusRow = document.getElementById("p-status-row");
  statusRow.innerHTML = Object.entries(STATUS_META).map(([key, m]) =>
    `<button class="status-choice${item.status===key?' active':''}" onclick="setPanelStatus('${key}')" data-status="${key}"><span class="dot" style="background:${m.color}"></span>${m.label}</button>`
  ).join("");
  document.getElementById("overlay").classList.add("show");
  document.getElementById("panel").classList.add("open");
  loadEvents(id);
}
function setPanelStatus(status) {
  const item = items.find(i => i.id === panelItemId);
  item._pendingStatus = status;
  document.querySelectorAll("#p-status-row .status-choice").forEach(el => {
    el.classList.toggle("active", el.dataset.status === status);
  });
}
function closePanel() {
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("panel").classList.remove("open");
  panelItemId = null;
}
async function loadEvents(itemId) {
  const { data } = await sb.from("item_events").select("*").eq("item_id", itemId).order("occurred_at", { ascending: false }).limit(10);
  const log = document.getElementById("event-log");
  if (!data || data.length === 0) { log.innerHTML = '<div class="event-row" style="color:var(--text-faint)">No history yet.</div>'; return; }
  log.innerHTML = data.map(e => `<div class="event-row"><span>${escapeHtml(e.detail || e.event_type)}</span><span>${new Date(e.occurred_at).toLocaleDateString()}</span></div>`).join("");
}
async function saveItem() {
  const item = items.find(i => i.id === panelItemId);
  if (!item) return;
  const newStatus = item._pendingStatus || item.status;
  const updates = {
    purchase_date: document.getElementById("p-purchase-date").value || null,
    price: document.getElementById("p-price").value ? Number(document.getElementById("p-price").value) : null,
    condition: document.getElementById("p-condition").value || null,
    notes: document.getElementById("p-notes").value || null,
    status: newStatus,
  };
  const { error } = await sb.from("items").update(updates).eq("id", item.id);
  if (error) { alert("Could not save: " + error.message); return; }
  if (newStatus !== item.status) {
    await sb.from("item_events").insert({ item_id: item.id, event_type: "status_change", detail: `Status changed to ${STATUS_META[newStatus].label}` });
  }
  closePanel();
  loadItems();
}

// ============================================================
// ADD ITEM MODAL
// ============================================================
function uniqueRegistryValues(field) {
  const vals = new Set();
  items.forEach(i => { if (i.model_registry?.[field]) vals.add(i.model_registry[field]); });
  return vals;
}
const STARTER_BY_FIELD = { category: STARTER_CATEGORIES, type: STARTER_TYPES, brand: STARTER_BRANDS };

function populateDropdown(id, starter, extra) {
  const sel = document.getElementById(id);
  const codes = new Set([...Object.keys(starter), ...extra]);
  sel.innerHTML = [...codes].sort().map(c => `<option value="${c}">${c}${starter[c] ? " — " + starter[c] : ""}</option>`).join("");
}
function openAddModal() {
  populateDropdown("m-category", STARTER_CATEGORIES, uniqueRegistryValues("category"));
  populateDropdown("m-type", STARTER_TYPES, uniqueRegistryValues("type"));
  populateDropdown("m-brand", STARTER_BRANDS, uniqueRegistryValues("brand"));
  ["m-model-code","m-display-name","m-purchase-date","m-price","m-condition","m-notes"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("serial-preview-box").textContent = "Serial will generate on save";
  document.getElementById("modal-overlay").classList.add("show");
  updateSerialPreview();
}
function closeAddModal() { document.getElementById("modal-overlay").classList.remove("show"); }
function addNewCode(which) {
  const label = { category: "category", type: "type", brand: "brand" }[which];
  const raw = prompt(`Enter a new single-character code for this ${label} (e.g. a letter not already used):`);
  if (!raw) return;
  const code = raw.trim().toUpperCase();
  if (code.length !== 1) { alert("Code must be exactly one character."); return; }
  const sel = document.getElementById("m-" + which);
  const already = [...sel.options].some(o => o.value === code);
  if (!already) {
    const opt = document.createElement("option");
    opt.value = code; opt.textContent = code + " (new)";
    sel.appendChild(opt);
  }
  sel.value = code;
  updateSerialPreview();
}
function updateSerialPreview() {
  const cat = document.getElementById("m-category").value;
  const type = document.getElementById("m-type").value;
  const brand = document.getElementById("m-brand").value;
  const code = document.getElementById("m-model-code").value.toUpperCase();
  const box = document.getElementById("serial-preview-box");
  if (cat && type && brand && code) {
    box.textContent = `${cat}${type}${brand}${code}··· (unit + checksum assigned on save)`;
  } else {
    box.textContent = "Fill in category, type, brand & model code to preview";
  }
}
async function submitNewItem() {
  const category = document.getElementById("m-category").value;
  const type = document.getElementById("m-type").value;
  const brand = document.getElementById("m-brand").value;
  const modelCode = document.getElementById("m-model-code").value.toUpperCase().trim();
  const displayName = document.getElementById("m-display-name").value.trim();
  if (category.length !== 1 || type.length !== 1 || brand.length !== 1 || !modelCode || !displayName) {
    alert("Category, type and brand must each be a single character, and model code/display name are required.");
    return;
  }
  const { data: serialData, error: serialError } = await sb.rpc("issue_serial", {
    p_category: category, p_type: type, p_brand: brand, p_model_code: modelCode,
    p_display_name: displayName, p_spec_json: {},
  });
  if (serialError) { alert("Could not generate serial: " + serialError.message); return; }
  const row = serialData[0];
  const { error: insertError } = await sb.from("items").insert({
    serial: row.serial, model_id: row.model_id, unit_id: row.unit_id,
    purchase_date: document.getElementById("m-purchase-date").value || null,
    price: document.getElementById("m-price").value ? Number(document.getElementById("m-price").value) : null,
    condition: document.getElementById("m-condition").value || null,
    notes: document.getElementById("m-notes").value || null,
    status: "idle",
  });
  if (insertError) { alert("Serial generated (" + row.serial + ") but saving the item failed: " + insertError.message); return; }
  closeAddModal();
  loadItems();
}

checkSession();
</script>
