<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7">
<title>MLX Gear</title>
<script>
  (function() {
    var saved = localStorage.getItem("mlx-gear-theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --bg2: #FFFFFF;
    --bg3: #F2F2F7;
    --bg4: #E5E5EA;
    --surface: rgba(0,0,0,0.04);
    --surface2: rgba(0,0,0,0.07);
    --border: rgba(0,0,0,0.09);
    --border2: rgba(0,0,0,0.16);
    --text: #000000;
    --text2: rgba(0,0,0,0.55);
    --text3: rgba(0,0,0,0.32);
    --accent: #4CC9F0;
    --accent-soft: rgba(76,201,240,0.15);
    --red: #FF3B30;
    --green: #06D6A0;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
    --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"] {
    --bg: #000;
    --bg2: #0f0f0f;
    --bg3: #1a1a1a;
    --bg4: #222;
    --surface: rgba(255,255,255,0.04);
    --surface2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #fff;
    --text2: rgba(255,255,255,0.55);
    --text3: rgba(255,255,255,0.3);
    --accent: #4CC9F0;
    --accent-soft: rgba(76,201,240,0.15);
    --red: #FF4444;
    --card-shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  *, *::before, *::after {
    transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, fill 0.35s ease, stroke 0.35s ease;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; }
  button { font-family: var(--font); cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: var(--font); color: var(--text); }
  input::placeholder, textarea::placeholder { color: var(--text3); }

  /* ── LOGIN ── */
  #login-screen { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 24px; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text2); }
  .wordmark span { color: var(--accent); }
  #login-screen .wordmark { font-size: 17px; }
  #login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  #login-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 13px; font-size: 15px; outline: none;
  }
  #login-box input:focus { border-color: var(--border2); }
  #login-box button.primary { background: var(--accent); color: #001217; font-weight: 700; padding: 13px; border-radius: var(--radius-sm); margin-top: 4px; font-size: 15px; }
  #login-error { color: var(--red); font-size: 12.5px; min-height: 16px; text-align: center; }

  /* ── LAYOUT ── */
  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; position: relative; }

  /* ── NAV ── */
  .nav { padding: calc(var(--safe-top) + 14px) 16px 0; flex-shrink: 0; background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .nav-row { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .nav-back { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .nav-back:active { opacity: 0.5; }
  .nav-title { flex: 1; min-width: 0; }
  .nav-title h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-title .breadcrumb { font-size: 12px; color: var(--text3); margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface2); transition: opacity 0.15s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .icon-btn:active { opacity: 0.5; }
  .icon-btn.danger { background: rgba(255,68,68,0.12); color: #FF4444; }
  .icon-btn.accent { background: var(--accent-soft); color: var(--accent); }

  /* ── SEARCH ── */
  .page-search-header { position: sticky; top: 0; background: var(--bg); z-index: 3; padding-bottom: 10px; margin-bottom: 2px; }
  .search-box { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 13px; transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .search-box.focused { border-color: var(--border2); }
  .search-box input { flex: 1; background: none; border: none; font-size: 15px; outline: none; }
  .search-box button { display: flex; color: var(--text3); transition: opacity 0.15s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .search-box button:active { opacity: 0.5; }

  /* ── SCROLL AREA ── */
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(var(--safe-bottom) + 90px); overflow-anchor: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .sync-note { font-size: 11px; color: var(--text3); text-align: center; padding: 6px 0 2px; }

  /* ── SECTION LABEL ── */
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; color: var(--text3); padding: 16px 4px 8px; text-transform: uppercase; }

  /* ── CRATE CARDS ── */
  .crate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .crate-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; position: relative; overflow: hidden; min-height: 130px; display: flex; flex-direction: column; transition: transform 0.18s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; box-shadow: var(--card-shadow); }
  .crate-card:active { transform: scale(0.97); }
  .crate-card-glow { position: absolute; inset: 0; pointer-events: none; }
  .crate-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .crate-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .crate-count { font-size: 11px; color: var(--text3); font-weight: 600; }
  .crate-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; margin: 10px 0 4px; }
  .crate-sub { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
  .bar-track { height: 2px; background: var(--surface2); border-radius: 1px; overflow: hidden; margin-top: auto; }
  .bar-fill { height: 100%; border-radius: 1px; opacity: 0.6; }

  /* ── CONTAINER LIST ── */
  .container-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; box-shadow: var(--card-shadow); }
  .container-card:active { background: var(--bg3); }
  .container-card-header { display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
  .container-type-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .container-meta { flex: 1; min-width: 0; }
  .container-name { font-size: 14px; font-weight: 600; }
  .container-sub { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: capitalize; }
  .container-preview { border-top: 0.5px solid var(--border); padding: 8px 14px 10px; }
  .preview-item { font-size: 12px; color: var(--text2); padding: 2px 0; display: flex; align-items: center; gap: 7px; }
  .preview-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }

  /* ── ITEM ROWS ── */
  .item-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.12s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; border-radius: 4px; }
  .item-row:last-child { border-bottom: none; }
  .item-row:active { background: var(--surface); }
  .item-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-serial { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .item-status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .item-tier { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; letter-spacing: 0.3px; }
  .tier-A { background: rgba(6,214,160,0.15); color: #06D6A0; }
  .tier-B { background: rgba(76,201,240,0.15); color: #4CC9F0; }
  .tier-C { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.4); }
  html[data-theme="dark"] .tier-C { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
  .tier-R { background: rgba(255,140,66,0.15); color: #FF8C42; }
  .tier-X { background: rgba(255,68,68,0.1); color: rgba(255,68,68,0.5); }
  .item-row-btn { background: none; border: none; padding: 6px; display: flex; color: var(--text3); flex-shrink: 0; }
  .item-row-btn.move:active { color: var(--accent); }
  .item-row-btn.del:active { color: var(--red); }

  /* ── ITEM DETAIL ── */
  .item-detail { animation: fadeUp 0.22s ease; }
  .item-image { width: 100%; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; background: var(--surface); border: 0.5px solid var(--border); }
  .item-image img { width: 100%; display: block; max-height: 260px; object-fit: cover; }
  .item-hero { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--card-shadow); }
  .item-hero-serial { font-size: 11px; letter-spacing: 1px; color: var(--text3); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .item-hero-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
  .item-hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border); }
  .item-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-stat { background: var(--surface); border-radius: var(--radius-sm); padding: 12px; }
  .item-stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
  .item-stat-val { font-size: 15px; font-weight: 600; }
  .item-desc-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
  .item-desc-label { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
  .item-desc-text { font-size: 14px; line-height: 1.6; color: var(--text2); }
  .status-row-m { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .status-choice-m { padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center; gap: 6px; background: var(--surface); }
  .status-choice-m.active { border-color: var(--border2); color: var(--text); background: var(--surface2); }
  .btn-row-detail { display: flex; gap: 8px; margin-top: 4px; }
  .event-log-m { display: flex; flex-direction: column; gap: 8px; }
  .event-row-m { font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; gap: 10px; }

  /* ── SEARCH RESULTS ── */
  .search-result { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
  .search-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .search-result-info { flex: 1; min-width: 0; }
  .search-result-name { font-size: 14px; font-weight: 500; }
  .search-result-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── LOOSE ITEMS ── */
  .loose-zone { border-radius: var(--radius); padding: 4px; }

  /* ── EMPTY STATE ── */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; }
  .empty-icon { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .empty h3 { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .empty p { font-size: 13px; color: var(--text3); }

  /* ── STATS PILLS ── */
  .stats-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat-pill { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 18px; display: flex; flex-direction: column; min-width: 90px; box-shadow: var(--card-shadow); }
  .stat-val { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; margin-top: 2px; }

  /* ── ADD BUTTONS ROW ── */
  .add-row { display: flex; gap: 8px; margin-top: 20px; }
  .add-btn { flex: 1; background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; color: var(--text2); display: flex; align-items: center; justify-content: center; gap: 7px; }
  .add-btn:active { background: var(--surface2); }

  /* ── FAB ── */
  .fab-wrap { position: fixed; bottom: calc(var(--safe-bottom) + 16px); right: 20px; max-width: calc(480px - 20px); pointer-events: none; display: flex; justify-content: flex-end; }
  .fab { width: 52px; height: 52px; border-radius: 16px; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(0,0,0,0.3); pointer-events: all; transition: transform 0.15s, background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .fab:active { transform: scale(0.93); }

  /* ── SHEET ── */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease; }
  .sheet { background: var(--bg2); border-radius: 22px 22px 0 0; border: 0.5px solid var(--border); padding: 12px 18px calc(var(--safe-bottom) + 24px); width: 100%; max-width: 480px; animation: sheetUp 0.28s cubic-bezier(0.4,0,0.2,1); max-height: 85vh; overflow-y: auto; overflow-x: hidden; box-shadow: 0 -2px 20px rgba(0,0,0,0.08); }
  .sheet-handle { width: 38px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
  .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.3px; }
  .sheet-input { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; font-size: 15px; color: var(--text); margin-bottom: 10px; outline: none; transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
  .sheet-input:focus { border-color: var(--border2); }
  textarea.sheet-input { resize: none; line-height: 1.6; min-height: 80px; }
  select.sheet-input { appearance: none; -webkit-appearance: none; text-overflow: ellipsis; }
  .sheet-row-2 { display: flex; gap: 8px; }
  .sheet-row-2 > * { flex: 1; min-width: 0; }
  .users-list-m { display: flex; flex-direction: column; gap: 2px; max-height: 45vh; overflow-y: auto; }
  .user-row-m { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .user-row-m:last-child { border-bottom: none; }
  .user-avatar-m { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--text2); flex-shrink: 0; }
  .user-email-m { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-badge-m { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.3px; text-transform: uppercase; flex-shrink: 0; }
  .role-badge-m.role-owner { background: rgba(255,209,102,0.18); color: #C9971A; }
  .role-badge-m.role-admin { background: rgba(76,201,240,0.18); color: #2B9BC4; }
  .role-badge-m.role-editor { background: rgba(6,214,160,0.18); color: #06A67F; }
  .role-badge-m.role-guest { background: rgba(107,114,128,0.18); color: #6b7280; }
  .role-select-m { width: auto; padding: 6px 9px; font-size: 12px; flex-shrink: 0; margin-bottom: 0; }
  .add-user-row-m { display: flex; gap: 8px; align-items: center; }
  html[data-theme="dark"] .role-badge-m.role-owner { color: #FFD166; }
  html[data-theme="dark"] .role-badge-m.role-admin { color: #4CC9F0; }
  html[data-theme="dark"] .role-badge-m.role-editor { color: #06D6A0; }
  html[data-theme="dark"] .role-badge-m.role-guest { color: #9aa1ac; }
  .sheet-btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .btn-cancel { flex: 1; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px; font-size: 15px; font-weight: 600; color: var(--text2); }
  .btn-cancel:active { background: var(--surface2); }
  .btn-confirm { flex: 1; border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 15px; font-weight: 700; color: #fff; }
  .btn-confirm:active { opacity: 0.8; }
  .btn-danger { flex: 1; background: rgba(255,68,68,0.12); border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 15px; font-weight: 700; color: var(--red); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .type-btn { flex: 1; min-width: 70px; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600; color: var(--text2); display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); }
  .type-btn.active { color: var(--text); border-color: var(--border2); background: var(--surface2); }
  .color-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin-bottom: 16px; }
  .color-swatch { aspect-ratio: 1; border-radius: 10px; border: 2.5px solid transparent; cursor: pointer; }
  .color-swatch.active { border-color: var(--text); }
  .tier-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 14px; }
  .tier-btn { padding: 10px 0; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; font-weight: 700; background: var(--surface); color: var(--text2); text-align: center; }
  .tier-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .sheet-label { font-size: 12px; color: var(--text3); margin-bottom: 8px; letter-spacing: 0.3px; }
  .code-row { display: flex; gap: 6px; min-width: 0; }
  .code-row select { min-width: 0; }
  .code-add-btn { width: 40px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 16px; color: var(--text2); }
  .serial-preview-box { font-family: var(--mono); font-size: 12.5px; color: var(--accent); background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 14px; }
  .img-upload-btn { width: 100%; background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 14px; font-size: 14px; color: var(--text2); display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .img-upload-btn:active { background: var(--surface2); }
  .img-preview-small { width: 100%; max-height: 160px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 8px; }

<script>
// ============================================================
// CONFIG — same Supabase project as the PC dashboard
// ============================================================
const SUPABASE_URL = "https://depprbklgspiawqhnuev.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lVIYRLl-dosIn7XvKWrxOg_PC3oT7t-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// ROLES — same four tiers and same user_roles table as the PC dashboard
// ============================================================
const ROLE_LABELS = { owner: "Owner", admin: "Admin", editor: "Editor", guest: "Guest" };
let myRole = null;
async function loadMyRole() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { myRole = "guest"; return; }

  myRole = data?.role || "guest";
}
function canEditItems() { return ["owner", "admin", "editor"].includes(myRole); }
function canManageRoles() { return ["owner", "admin"].includes(myRole); }
function canEditTargetRole(targetRole) {
  if (myRole === "owner") return targetRole !== "owner";
  if (myRole === "admin") return !["owner", "admin"].includes(targetRole);

}
function requireEdit() {
  if (!canEditItems()) { toast("Guests can only view — no editing on this account."); return false; }
  return true;
}

const STATUS_META = {
  idle:      { label: "Idle",      color: "#6b7280" },
  in_use:    { label: "In use",    color: "#4CC9F0" },
  on_set:    { label: "On set",    color: "#9b5de5" },
  borrowed:  { label: "Borrowed",  color: "#f4a261" },
  damaged:   { label: "Damaged",   color: "#FF4444" },
  repaired:  { label: "Repaired",  color: "#06D6A0" },
};
const STARTER_CATEGORIES = { C: "Camera", L: "Lens", W: "Wireless", P: "Power", G: "Grip", T: "Tripod/Support", I: "Illumination", A: "Audio" };
const STARTER_TYPES = { C: "Cinema", M: "Mirrorless", P: "Prime", Z: "Zoom" };
const STARTER_BRANDS = { A: "ARRI", B: "Blackmagic", C: "Canon", S: "Sony", F: "Fujifilm", R: "RED", P: "Panasonic", N: "Nikon", D: "DJI", Z: "Zeiss", G: "Sigma", T: "Teradek" };
const PALETTES = ["#4CC9F0","#FF6B6B","#FFD166","#06D6A0","#7B5EA7","#FF8C42","#F72585","#118AB2","#E76F51","#A8DADC"];
const TIER_COLORS = {A:"#06D6A0",B:"#4CC9F0",C:"rgba(255,255,255,0.35)",R:"#FF8C42",X:"rgba(255,68,68,0.5)"};
const TIER_LABELS = {A:"Pro",B:"Secondary",C:"Utility",R:"Rental",X:"Retired"};
const LOC_TYPES = ["case","crate","box","bag"];
const ICON_PATH = {
  case: "M3 7h18v13H3zM8 7V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M3 13h18",
  crate: "M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7l8.7 5 8.7-5M12 22V12",
  box: "M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7l8.7 5 8.7-5M12 22V12",
  bag: "M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0",
};
const svgIcon = (d,w=16,op=1,color="currentColor") =>
  `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:${op};display:block;flex-shrink:0">${
    d.split("M").filter(Boolean).map(s=>`<path d="M${s}"/>`).join("")
  }</svg>`;
function escapeHtml(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function formatPrice(p) { return p ? Number(p).toLocaleString() + " Kč" : "—"; }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function setLoading(on) { document.getElementById("loading-veil").classList.toggle("show", !!on); }
const SUN_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
const MOON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>`;
function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
function applyThemeIcon() {
  const btn = document.getElementById("theme-toggle-btn");
  if (!btn) return;
  btn.innerHTML = currentTheme() === "dark" ? SUN_SVG : MOON_SVG;
}
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  if (next === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("mlx-gear-theme", next);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", next === "dark" ? "#000000" : "#F2F2F7");
  applyThemeIcon();
}
function setHTML(id, html) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = html;
  el.scrollTop = 0;
}

// ============================================================
// STATE
// ============================================================
let locations = [];
let items = [];
let view = "home"; // home | location | item
let pathStack = []; // location id breadcrumb for current "location" view
let activeItemId = null;
let historyStack = [];
let searchMode = false;
let searchQuery = "";
let html5QrCode = null;
let homePage = 0; // 0 = crates grid, 1 = inventory sheet (swipe left from crates)
let sheetQuery = "";
let sheetStatusFilter = null;
let sheetSort = { field: "name", dir: 1 }; // field: name | price | purchase_date | status
const SORT_LABELS = { name: "Name", price: "Price", purchase_date: "Date added", status: "Status" };

function pushHistory() { historyStack.push({ view, pathStack: [...pathStack], activeItemId, homePage }); }
function currentLocationId() { return pathStack.length ? pathStack[pathStack.length - 1] : null; }

// ============================================================
// AUTH
// ============================================================
async function doLogin() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  enterApp();
}
async function doLogout() {
  await sb.auth.signOut();
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
}
async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) enterApp();
}
async function enterApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  setLoading(true);
  await loadMyRole();
  await loadAll();
  setLoading(false);
  view = "home"; pathStack = []; activeItemId = null; historyStack = []; homePage = 0;
  render();
}

// ============================================================
// DATA LOADING (same tables/columns the PC dashboard uses,
// plus the extra color/tags/tier columns from the migration)
// ============================================================
async function loadAll() {
  await Promise.all([loadLocations(), loadItems()]);
}
async function loadLocations() {
  const { data, error } = await sb.from("locations").select("id, name, location_type, parent_id, color").order("name");
  if (error) { console.error(error); toast("Could not load locations"); return; }
  locations = data || [];
}
async function loadItems() {
  const { data, error } = await sb
    .from("items")
    .select("id, serial, purchase_date, price, condition, notes, photo_url, status, location_id, tags, tier, created_at, model_registry(id, category, type, brand, model_code, display_name, spec_json)");
  if (error) { console.error(error); toast("Could not load items"); return; }
  items = (data || []).map(i => ({
    ...i,
    name: i.model_registry?.display_name || "(unknown model)",
    category: i.model_registry?.category || "",
  }));
}

// ============================================================
// LOCATION TREE HELPERS
// ============================================================
function locationById(id) { return locations.find(l => l.id === id); }
function childrenOf(parentId) { return locations.filter(l => (l.parent_id || null) === (parentId || null)); }
function descendantIds(id) {
  const out = [id];
  childrenOf(id).forEach(c => out.push(...descendantIds(c.id)));
  return out;
}
function breadcrumbNames(id) {
  const chain = [];
  let cur = locationById(id);
  let guard = 0;
  while (cur && guard++ < 12) { chain.unshift(cur.name); cur = cur.parent_id ? locationById(cur.parent_id) : null; }
  return chain;
}
function hashColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return PALETTES[h % PALETTES.length];
}
function locationColor(loc) { return loc?.color || (loc ? hashColor(loc.id) : PALETTES[0]); }
function locationStats(id) {
  const ids = new Set(descendantIds(id));
  const inside = items.filter(i => i.location_id && ids.has(i.location_id));
  return { count: inside.length, value: inside.reduce((s, i) => s + (Number(i.price) || 0), 0) };
}
function itemsDirectlyIn(id) { return items.filter(i => (i.location_id || null) === (id || null)); }
function allTopLevel() { return childrenOf(null); }
function iconForType(t) { return ICON_PATH[t] || ICON_PATH.box; }

function uniqueRegistryValues(field) {
  const vals = new Set();
  items.forEach(i => { if (i.model_registry?.[field]) vals.add(i.model_registry[field]); });
  return vals;
}

// ============================================================
// NAVIGATION
// ============================================================
function goHome() { pushHistory(); view = "home"; pathStack = []; activeItemId = null; searchMode = false; searchQuery = ""; homePage = 0; render(); }
function openLocation(id) { pushHistory(); view = "location"; pathStack.push(id); activeItemId = null; render(); }
function openItem(itemId) {
  pushHistory();
  const item = items.find(i => i.id === itemId);
  activeItemId = itemId; view = "item";
  // build a breadcrumb path (for display only) up to the item's own location
  pathStack = item && item.location_id ? [...ancestorChain(item.location_id)] : [];
  render();
}
function ancestorChain(id) {
  const chain = [];
  let cur = locationById(id);
  let guard = 0;
  while (cur) { chain.unshift(cur.id); cur = cur.parent_id ? locationById(cur.parent_id) : null; if (guard++ > 12) break; }
  return chain;
}
function goBack() {
  const prev = historyStack.pop();
  if (!prev) { view = "home"; pathStack = []; activeItemId = null; homePage = 0; render(); return; }
  view = prev.view; pathStack = prev.pathStack; activeItemId = prev.activeItemId; homePage = prev.homePage ?? 0;
  render();
}
function goToHomePage(i) {
  homePage = i;
  updateDots();
  const pager = document.getElementById("home-pager");
  pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" });
}
function updateDots() {
  document.querySelectorAll(".page-dots .dot").forEach((d, i) => d.classList.toggle("active", i === homePage));
}
function initPagerScrollListener() {
  const pager = document.getElementById("home-pager");
  let debounce;
  pager.addEventListener("scroll", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const w = pager.clientWidth || 1;
      const idx = Math.round(pager.scrollLeft / w);
      if (idx !== homePage) { homePage = idx; updateDots(); }
    }, 80);
  }, { passive: true });
}

// ============================================================
// RENDER ROUTER
// ============================================================
function render() {
  renderNav();
  const isHome = view === "home";
  document.getElementById("home-pager").style.display = isHome ? "flex" : "none";
  document.getElementById("scroll").style.display = isHome ? "none" : "";

  if (isHome) {
    if (searchMode && searchQuery) renderSearch("home-page-crates");
    else renderHome("home-page-crates");
    renderSheetInto("home-page-sheet");
    updateDots();
    requestAnimationFrame(() => {
      const pager = document.getElementById("home-pager");
      pager.scrollLeft = homePage * pager.clientWidth;
    });
  }
  else if (view === "location") renderLocationView();
  else if (view === "item") renderItemView();
}

// ============================================================
// NAV BAR
// ============================================================
function renderNav() {
  const nav = document.getElementById("nav");
  const loc = view !== "home" && view !== "item" ? locationById(currentLocationId()) : null;
  const item = view === "item" ? items.find(i => i.id === activeItemId) : null;

  let left = "", title = "", right = "";

  if (view === "home") {
    left = `<div class="wordmark">MLX <span>GEAR</span></div>`;
    title = `<div class="page-dots" id="page-dots"><button class="dot${homePage===0?' active':''}" onclick="goToHomePage(0)"></button><button class="dot${homePage===1?' active':''}" onclick="goToHomePage(1)"></button></div>`;

      <button class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme"></button>
      ${canManageRoles() ? `<button class="icon-btn accent" onclick="openUsersSheet()" title="Users">${svgIcon("M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",16)}</button>` : ""}
      <button class="icon-btn accent" onclick="openScanner()" title="Scan tag">${svgIcon("M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18",16)}</button>
      ${canEditItems() ? `<button class="icon-btn accent" onclick="openAddLocationSheet(null)" title="New crate">${svgIcon("M12 5v14M5 12h14",16)}</button>` : ""}`;
  } else if (view === "location") {
    const crumbs = breadcrumbNames(loc?.id).slice(0, -1).join(" › ");
    left = `<button class="nav-back" onclick="goBack()">${svgIcon("M15 18l-6-6 6-6",20)}</button>`;
    title = `${crumbs ? `<div class="breadcrumb">${escapeHtml(crumbs)}</div>` : ""}<h1>${escapeHtml(loc?.name || "")}</h1>`;
    right = canEditItems() ? `
      <button class="icon-btn" onclick="openRenameLocationSheet('${loc?.id}')" title="Rename">${svgIcon("M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z",16)}</button>
      <button class="icon-btn" onclick="openColorSheet('${loc?.id}')" style="background:${locationColor(loc)}22;border:0.5px solid ${locationColor(loc)}40"><span style="width:10px;height:10px;border-radius:50%;background:${locationColor(loc)};display:inline-block"></span></button>
      <button class="icon-btn danger" onclick="openDeleteLocationSheet('${loc?.id}')" title="Delete">${svgIcon("M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",16)}</button>` : "";
  } else if (view === "item") {
    const crumbs = [itemLoc?.name ? breadcrumbNames(itemLoc.id).join(" › ") : "Unassigned"].join("");
    left = `<button class="nav-back" onclick="goBack()">${svgIcon("M15 18l-6-6 6-6",20)}</button>`;
    title = `<div class="breadcrumb">${escapeHtml(crumbs)}</div><h1 style="font-size:15px">${escapeHtml(item?.name || "")}</h1>`;
    right = canEditItems() ? `
      <button class="icon-btn" onclick="openMoveSheet('${item?.id}')" title="Move">${svgIcon("M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20",16)}</button>
      <button class="icon-btn" onclick="openEditItemSheet('${item?.id}')" title="Edit">${svgIcon("M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z",16)}</button>

  }

function initSearch() {
  const inp = document.getElementById("search-input");

  inp.value = searchQuery;
  inp.oninput = e => { searchQuery = e.target.value; clr.style.display = searchQuery ? "" : "none"; if (searchQuery) { searchMode = true; renderSearch("home-page-crates"); } else { searchMode = false; renderHome("home-page-crates"); } };

// INVENTORY SHEET — stripped, mobile version of the PC dashboard's table.
// Reached by swiping left from the crates page.
// ============================================================
function sheetFilteredSorted() {
  const q = sheetQuery.trim().toLowerCase();
  let rows = items.filter(i => {
    if (sheetStatusFilter && i.status !== sheetStatusFilter) return false;
    if (q && !((i.name || "").toLowerCase().includes(q) || (i.serial || "").toLowerCase().includes(q))) return false;
    return true;
  });
  rows.sort((a, b) => {
    let av, bv;
    if (sheetSort.field === "price") { av = Number(a.price) || 0; bv = Number(b.price) || 0; }
    else if (sheetSort.field === "purchase_date") { av = a.purchase_date || ""; bv = b.purchase_date || ""; }
    else if (sheetSort.field === "status") { av = a.status || ""; bv = b.status || ""; }
    else { av = (a.name || "").toLowerCase(); bv = (b.name || "").toLowerCase(); }
    if (av < bv) return -1 * sheetSort.dir;
    if (av > bv) return 1 * sheetSort.dir;
    return 0;
  });
  return rows;
}
function renderSheetInto(targetId) {
  const rows = sheetFilteredSorted();
  const totalValue = rows.reduce((s, i) => s + (Number(i.price) || 0), 0);
  const statuses = Object.keys(STATUS_META);
  let html = `<div class="sheet-page-header">
    <div class="section-label" style="padding-top:2px">Inventory</div>
    <div class="search-box" id="sheet-search-box" style="margin-bottom:10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;opacity:0.4"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="sheet-search-input" type="search" placeholder="Search inventory…" value="${escapeHtml(sheetQuery)}" oninput="onSheetSearchInput(this.value)">
    </div>
    <div class="chip-row">
      <button class="chip${!sheetStatusFilter ? " active" : ""}" onclick="setSheetStatusFilter(null)">All</button>
      ${statuses.map(s => `<button class="chip${sheetStatusFilter === s ? " active" : ""}" onclick="setSheetStatusFilter('${s}')"><span style="width:6px;height:6px;border-radius:50%;background:${STATUS_META[s].color};display:inline-block"></span>${STATUS_META[s].label}</button>`).join("")}
    </div>
    <div class="sheet-stats-line">
      <span>${rows.length} item${rows.length !== 1 ? "s" : ""} · ${totalValue.toLocaleString()} Kč</span>
      <button class="sort-btn" onclick="openSortSheet()">${SORT_LABELS[sheetSort.field]} ${sheetSort.dir === 1 ? "↑" : "↓"}</button>
    </div>
  </div>`;
  if (!rows.length) {
    html += `<div class="empty"><div class="empty-icon" style="background:rgba(76,201,240,0.1)">${svgIcon("M9 17V7m6 10V11m6 6V4M3 21h18",26,0.5,"#4CC9F0")}</div><h3>No items match</h3><p>Try a different search or filter</p></div>`;
  } else {
    html += rows.map(i => sheetRowHTML(i)).join("");
  }
  setHTML(targetId, html);
}
function sheetRowHTML(item) {
  const sm = STATUS_META[item.status] || STATUS_META.idle;
  const loc = item.location_id ? locationById(item.location_id) : null;
  const locText = loc ? breadcrumbNames(loc.id).join(" › ") : "Unassigned";
  return `<div class="item-row" onclick="openItem('${item.id}')">
    <span class="item-dot" style="background:${sm.color}"></span>
    <div class="item-info">
      <div class="item-name">${escapeHtml(item.name)}</div>
      <div class="item-serial">${escapeHtml(item.serial || "—")} · ${escapeHtml(locText)}</div>
    </div>
    <div style="text-align:right;flex-shrink:0;font-size:13px;font-weight:600">${formatPrice(item.price)}</div>

}
function onSheetSearchInput(val) {
  sheetQuery = val;
  renderSheetInto("home-page-sheet");
  const inp = document.getElementById("sheet-search-input");
  if (inp) { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
}
function setSheetStatusFilter(s) { sheetStatusFilter = s; renderSheetInto("home-page-sheet"); }
function openSortSheet() {
  const opts = [
    { field: "name", dir: 1, label: "Name (A–Z)" },
    { field: "name", dir: -1, label: "Name (Z–A)" },
    { field: "price", dir: -1, label: "Price (high to low)" },
    { field: "price", dir: 1, label: "Price (low to high)" },
    { field: "purchase_date", dir: -1, label: "Recently added" },
    { field: "status", dir: 1, label: "Status" },
  ];
  openSheet(`<div class="sheet-title">Sort by</div>` +
    opts.map(o => `<div class="move-row" onclick="applySheetSort('${o.field}',${o.dir})">
      <div style="flex:1;font-size:14px;font-weight:500">${o.label}</div>
      ${sheetSort.field === o.field && sheetSort.dir === o.dir ? svgIcon("M20 6L9 17l-5-5",16,1,"var(--accent)") : ""}
    </div>`).join("") +
    `<button class="btn-cancel" onclick="closeSheet()" style="width:100%;margin-top:6px">Close</button>`);

function applySheetSort(field, dir) {

}

  html += `<div class="item-desc-card"><div class="item-desc-label">History</div><div class="event-log-m" id="event-log-m"><div style="color:var(--text3);font-size:12px">Loading…</div></div></div>`;

async function loadEvents(itemId) {
  const { data } = await sb.from("item_events").select("*").eq("item_id", itemId).order("occurred_at", { ascending: false }).limit(10);
  const log = document.getElementById("event-log-m");
  if (!log) return;
  if (!data || data.length === 0) { log.innerHTML = '<div style="color:var(--text3);font-size:12px">No history yet.</div>'; return; }
  log.innerHTML = data.map(e => `<div class="event-row-m"><span>${escapeHtml(e.detail || e.event_type)}</span><span>${new Date(e.occurred_at).toLocaleDateString()}</span></div>`).join("");
}
async function quickSetStatus(itemId, status) {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === itemId);
  if (!item || item.status === status) return;
  const { error } = await sb.from("items").update({ status }).eq("id", itemId);
  if (error) { toast("Could not update status"); return; }
  await sb.from("item_events").insert({ item_id: itemId, event_type: "status_change", detail: `Status changed to ${STATUS_META[status].label}` });
  item.status = status;
  toast(`Marked ${STATUS_META[status].label.toLowerCase()}`);
  renderItemView();
}

// ============================================================
// USERS & ROLES — stripped-down version of the PC dashboard's tab
// ============================================================
let userRows = [];
function initialsFor(email) { return (email || "?").slice(0, 2).toUpperCase(); }
async function loadUsers() {
  const { data, error } = await sb.from("user_roles").select("user_id, email, role").order("role");
  if (error) { toast("Could not load users"); userRows = []; return; }
  const order = { owner: 0, admin: 1, editor: 2, guest: 3 };
  userRows = (data || []).sort((a, b) => (order[a.role] ?? 9) - (order[b.role] ?? 9) || (a.email || "").localeCompare(b.email || ""));
}
async function openUsersSheet() {
  if (!canManageRoles()) return;
  await loadUsers();
  const { data: { user } } = await sb.auth.getUser();
  const myId = user?.id;
  const canManage = canManageRoles();
  const rows = userRows.map(u => {
    const canEditThis = canManage && canEditTargetRole(u.role) && u.user_id !== myId;
    const roleOptions = ["owner","admin","editor","guest"]
      .filter(r => myRole === "owner" || !["owner","admin"].includes(r))
      .map(r => `<option value="${r}" ${r===u.role?"selected":""}>${ROLE_LABELS[r]}</option>`).join("");
    return `<div class="user-row-m">
      <div class="user-avatar-m">${initialsFor(u.email)}</div>
      <div class="user-email-m">${escapeHtml(u.email || u.user_id)}${u.user_id===myId ? " (you)" : ""}</div>
      ${canEditThis
        ? `<select class="role-select-m" onchange="setUserRole('${u.user_id}', this.value)">${roleOptions}</select>`
        : `<span class="role-badge-m role-${u.role}">${ROLE_LABELS[u.role] || u.role}</span>`}
    </div>`;
  }).join("") || `<p style="font-size:13px;color:var(--text3);padding:8px 0">No one has an assigned role yet.</p>`;

  const assignable = myRole === "owner" ? ["admin","editor","guest"] : ["editor","guest"];
  const addRow = canManage ? `
    <div class="sheet-label" style="margin-top:16px">Grant access</div>
    <div class="add-user-row-m">
      <input class="sheet-input" id="s-add-user-email" placeholder="Email (must have signed in once)" style="margin-bottom:0;flex:1">
      <select id="s-add-user-role" style="width:auto">${assignable.map(r => `<option value="${r}">${ROLE_LABELS[r]}</option>`).join("")}</select>
    </div>
    <button class="btn-confirm" style="width:100%;margin-top:10px" onclick="submitAddUserRole()">Grant access</button>` : "";

  openSheet(`
    <div class="sheet-title">Users</div>
    <div class="users-list-m">${rows}</div>
    ${addRow}
  `);
}
async function setUserRole(userId, newRole) {
  const { error } = await sb.from("user_roles").update({ role: newRole }).eq("user_id", userId);
  if (error) { toast("Could not update role"); return; }
  toast("Role updated");
  openUsersSheet();
}
async function submitAddUserRole() {
  const email = document.getElementById("s-add-user-email")?.value.trim();
  const role = document.getElementById("s-add-user-role")?.value;
  if (!email) { toast("Enter an email first"); return; }
  const { data: uid, error: lookupError } = await sb.rpc("get_user_id_by_email", { p_email: email });
  if (lookupError) { toast("Lookup failed: " + lookupError.message); return; }
  if (!uid) { toast("No account found — they need to sign in once first"); return; }
  const { error } = await sb.from("user_roles").upsert({ user_id: uid, email, role });
  if (error) { toast("Could not grant access: " + error.message); return; }
  toast("Access granted");
  openUsersSheet();
}

// LOCATION SHEETS (crates + bags/boxes are both just "locations")
// ============================================================
let _newLocType = "case";
let _newLocParent = null;
function openAddLocationSheet(parentId) {
  if (!requireEdit()) return;
  _newLocParent = parentId || null;
  _newLocType = parentId ? "bag" : "case";
  openSheet(`
    <div class="sheet-title">${parentId ? "Add bag or box" : "New crate"}</div>
    <div class="type-toggle">${LOC_TYPES.map(t => `<button class="type-btn${t===_newLocType?" active":""}" id="loctype-${t}" onclick="selectNewLocType('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
    <input class="sheet-input" id="s-name" placeholder="Name…" onkeydown="if(event.key==='Enter')submitNewLocation()">
    <div class="sheet-label">Color</div>
    <div class="color-grid">${PALETTES.map((c,i)=>`<button class="color-swatch${i===0?" active":""}" style="background:${c}" data-color="${c}" onclick="selectLocColor(this)"></button>`).join("")}</div>
    <div class="sheet-btn-row">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-confirm" id="s-confirm" style="background:${PALETTES[0]}" onclick="submitNewLocation()">Create</button>
    </div>`);
}
function selectNewLocType(t) {
  _newLocType = t;
  LOC_TYPES.forEach(x => document.getElementById("loctype-"+x)?.classList.toggle("active", x===t));
}
function selectLocColor(el) {
  document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
  el.classList.add("active");
  const btn = document.getElementById("s-confirm");
  if (btn) btn.style.background = el.dataset.color;
}
async function submitNewLocation() {
  if (!requireEdit()) return;
  const name = document.getElementById("s-name")?.value.trim();
  if (!name) return;
  const color = document.querySelector(".color-swatch.active")?.dataset.color || PALETTES[0];
  const { error } = await sb.from("locations").insert({ name, location_type: _newLocType, parent_id: _newLocParent, color });
  if (error) { toast("Could not create: " + error.message); return; }
  await loadAll();
  closeSheet();
  render();
}

function openRenameLocationSheet(id) {
  if (!requireEdit()) return;
  const loc = locationById(id);
  openSheet(`
    <div class="sheet-title">Rename</div>
    <input class="sheet-input" id="s-name" value="${escapeHtml(loc?.name||"")}" onkeydown="if(event.key==='Enter')submitRenameLocation('${id}')">
    <div class="sheet-btn-row">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-confirm" style="background:${locationColor(loc)}" onclick="submitRenameLocation('${id}')">Rename</button>
    </div>`);
}
async function submitRenameLocation(id) {
  if (!requireEdit()) return;
  const name = document.getElementById("s-name")?.value.trim();
  if (!name) return;
  const { error } = await sb.from("locations").update({ name }).eq("id", id);
  if (error) { toast("Could not rename: " + error.message); return; }
  await loadAll(); closeSheet(); render();
}

function openColorSheet(id) {
  if (!requireEdit()) return;
  const loc = locationById(id);
  openSheet(`
    <div class="sheet-title">Color</div>
    <div class="color-grid">${PALETTES.map(c=>`<button class="color-swatch${locationColor(loc)===c?" active":""}" style="background:${c}" data-color="${c}" onclick="submitColor('${id}','${c}')"></button>`).join("")}</div>
    <button class="btn-cancel" onclick="closeSheet()" style="width:100%">Cancel</button>`);
}
async function submitColor(id, color) {
  if (!requireEdit()) return;
  const { error } = await sb.from("locations").update({ color }).eq("id", id);
  if (error) { toast("Could not update color"); return; }
  await loadAll(); closeSheet(); render();
}

function openDeleteLocationSheet(id) {
  if (!requireEdit()) return;
  const loc = locationById(id);
  const stats = locationStats(id);
  const kids = childrenOf(id).length;
  openSheet(`
    <div class="sheet-title">Delete "${escapeHtml(loc?.name||"")}"?</div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.6">
      ${kids ? `${kids} bag/box${kids!==1?"es":""} inside will also be deleted. ` : ""}
      ${stats.count ? `${stats.count} item(s) inside will become unassigned (not deleted).` : "This location is empty."}
    </p>
    <div class="sheet-btn-row">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-danger" onclick="confirmDeleteLocation('${id}')">Delete</button>
    </div>`);
}
async function confirmDeleteLocation(id) {
  if (!requireEdit()) return;
  const { error } = await sb.from("locations").delete().eq("id", id);
  if (error) { toast("Could not delete: " + error.message); return; }
  await loadAll();
  closeSheet();
  goHome();
}

// ============================================================
// MOVE SHEET — the fast "put this somewhere else" flow
// ============================================================
function openMoveSheet(itemId) {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const sorted = [...locations].sort((a,b) => breadcrumbNames(a.id).join(" › ").localeCompare(breadcrumbNames(b.id).join(" › ")));
  const rows = sorted.map(l => {
    const isCurrent = item.location_id === l.id;
    return `<div class="move-row${isCurrent?" current":""}" onclick="${isCurrent?"":`confirmMove('${itemId}','${l.id}')`}">
      <div class="container-type-icon" style="background:${locationColor(l)}15;border:1px solid ${locationColor(l)}25">${svgIcon(iconForType(l.location_type),13,1,locationColor(l))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13.5px;font-weight:500">${escapeHtml(breadcrumbNames(l.id).join(" › "))}</div>
      </div>
      ${isCurrent?`<span style="font-size:11px;color:var(--text3)">current</span>`:""}
    </div>`;
  }).join("");
  openSheet(`
    <div class="sheet-title">Move "${escapeHtml(item.name)}"</div>
    ${item.location_id ? `<div class="move-row" onclick="confirmMove('${itemId}',null)"><div class="container-type-icon" style="background:var(--surface2)">${svgIcon("M18 6L6 18M6 6l12 12",13)}</div><div style="flex:1"><div style="font-size:13.5px;font-weight:500">Unassign (no location)</div></div></div>` : ""}
    <div class="move-list">${rows || '<p style="font-size:13px;color:var(--text3);padding:10px 0">No locations yet — create a crate first.</p>'}</div>
    <button class="btn-cancel" onclick="closeSheet()" style="width:100%">Cancel</button>`);
}
async function confirmMove(itemId, toLocationId) {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const { error } = await sb.from("items").update({ location_id: toLocationId }).eq("id", itemId);
  if (error) { toast("Could not move: " + error.message); return; }
  const destName = toLocationId ? breadcrumbNames(toLocationId).join(" › ") : "Unassigned";
  await sb.from("item_events").insert({ item_id: itemId, event_type: "moved", detail: `Moved to ${destName}` });
  await loadAll();
  closeSheet();
  toast(`Moved to ${destName}`);
  render();
}

// ============================================================
// ADD / EDIT ITEM
// ============================================================
let _editItemId = null;
let _editLocationId = null;
let _editTier = "C";
let _editImageData = null; // pending new photo (base64), null = unchanged/none
let _removeExistingPhoto = false;

function populateCodeSelect(id, starter, extra) {
  const codes = new Set([...Object.keys(starter), ...extra]);
  return [...codes].sort().map(c => `<option value="${c}">${c}${starter[c] ? " — " + starter[c] : ""}</option>`).join("");
}
function codeFieldHTML(label, fieldId, starter, extra) {
  return `<div>
    <span class="sheet-label" style="margin-bottom:5px;display:block">${label}</span>
    <div class="code-row">
      <select class="sheet-input" style="margin-bottom:0" id="${fieldId}" onchange="updateSerialPreview()">${populateCodeSelect(fieldId, starter, extra)}</select>
      <button type="button" class="code-add-btn" onclick="addNewCode('${fieldId}')">+</button>
    </div>
  </div>`;
}
function addNewCode(fieldId) {
  const raw = prompt("Enter a new single-character code (a letter not already used):");
  if (!raw) return;
  const code = raw.trim().toUpperCase();
  if (code.length !== 1) { alert("Code must be exactly one character."); return; }
  const sel = document.getElementById(fieldId);
  if (![...sel.options].some(o => o.value === code)) {
    const opt = document.createElement("option");
    opt.value = code; opt.textContent = code + " (new)";
    sel.appendChild(opt);
  }
  sel.value = code;
  updateSerialPreview();
}
function updateSerialPreview() {
  const cat = document.getElementById("m-category")?.value;
  const type = document.getElementById("m-type")?.value;
  const brand = document.getElementById("m-brand")?.value;
  const code = document.getElementById("m-model-code")?.value.toUpperCase();
  const box = document.getElementById("serial-preview-box");
  if (!box) return;
  if (cat && type && brand && code) box.textContent = `${cat}${type}${brand}${code}··· (unit + checksum assigned on save)`;
  else box.textContent = "Fill in category, type, brand & model code to preview";
}

function tierGridHTML() {
  return `<div class="sheet-label">Tier</div>
  <div class="tier-grid">${["A","B","C","R","X"].map(t => `<button type="button" class="tier-btn${t===_editTier?" active":""}" id="tierbtn-${t}" onclick="selectTier('${t}')" style="color:${TIER_COLORS[t]}">${t}</button>`).join("")}</div>`;
}
function selectTier(t) {
  _editTier = t;
  ["A","B","C","R","X"].forEach(x => document.getElementById("tierbtn-"+x)?.classList.toggle("active", x===t));
}
function previewImage(input) {
  const file = input.files[0]; if (!file) return;
  resizeImageToDataUrl(file, 900, 0.72, (dataUrl) => {
    _editImageData = dataUrl;
    _removeExistingPhoto = false;
    const prev = document.getElementById("s-img-preview");
    if (prev) prev.innerHTML = `<img class="img-preview-small" src="${dataUrl}"><button type="button" class="remove-img-btn" onclick="removePendingImg()">Remove photo</button>`;
    const btn = document.getElementById("img-upload-btn-el");
    if (btn) btn.style.display = "none";
  });
}
function removePendingImg() {
  _editImageData = null; _removeExistingPhoto = true;
  const prev = document.getElementById("s-img-preview"); if (prev) prev.innerHTML = "";
  const btn = document.getElementById("img-upload-btn-el"); if (btn) btn.style.display = "";
}
function resizeImageToDataUrl(file, maxDim, quality, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openAddItemSheet(locationId) {
  if (!requireEdit()) return;
  _editItemId = null; _editLocationId = locationId || null; _editTier = "C"; _editImageData = null; _removeExistingPhoto = false;
  const loc = locationById(locationId);
  openSheet(`
    <div class="sheet-title">Add item</div>
    <div class="sheet-label">Adding to: ${loc ? escapeHtml(breadcrumbNames(loc.id).join(" › ")) : "Unassigned"}</div>
    <input class="sheet-input" id="s-name" placeholder="Display name (e.g. Blackmagic Pocket 6K)" style="margin-top:8px">
    <div class="sheet-row-2" style="margin-bottom:10px">
      ${codeFieldHTML("Category", "m-category", STARTER_CATEGORIES, uniqueRegistryValues("category"))}
      ${codeFieldHTML("Type", "m-type", STARTER_TYPES, uniqueRegistryValues("type"))}
    </div>
    <div class="sheet-row-2" style="margin-bottom:10px">
      ${codeFieldHTML("Brand", "m-brand", STARTER_BRANDS, uniqueRegistryValues("brand"))}
      <div>
        <span class="sheet-label" style="margin-bottom:5px;display:block">Model code</span>
        <input class="sheet-input" style="margin-bottom:0" id="m-model-code" maxlength="3" placeholder="e.g. P6" oninput="updateSerialPreview()">
      </div>
    </div>
    <div class="serial-preview-box" id="serial-preview-box">Fill in category, type, brand & model code to preview</div>
    ${tierGridHTML()}
    <input class="sheet-input" id="s-tags" placeholder="Tags, comma separated">
    <div class="sheet-row-2">
      <input class="sheet-input" id="s-purchase-date" type="date">
      <input class="sheet-input" id="s-price" type="number" placeholder="Price (CZK)">
    </div>
    <input class="sheet-input" id="s-condition" placeholder="Condition (e.g. New)">
    <textarea class="sheet-input" id="s-notes" placeholder="Notes…" rows="3"></textarea>
    <button type="button" class="img-upload-btn" id="img-upload-btn-el" onclick="document.getElementById('s-img-input').click()">${svgIcon("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",14,0.7)} Add photo</button>
    <input type="file" id="s-img-input" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
    <div id="s-img-preview"></div>
    <div class="sheet-btn-row">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-confirm" style="background:${locationColor(loc)}" onclick="submitNewItem()">Generate & add</button>
    </div>`);
  updateSerialPreview();
}

async function submitNewItem() {
  if (!requireEdit()) return;
  const displayName = document.getElementById("s-name").value.trim();
  const category = document.getElementById("m-category").value;
  const type = document.getElementById("m-type").value;
  const brand = document.getElementById("m-brand").value;
  const modelCode = document.getElementById("m-model-code").value.toUpperCase().trim();
  if (!displayName || category.length !== 1 || type.length !== 1 || brand.length !== 1 || !modelCode) {
    alert("Name, category, type, brand and model code are required.");
    return;
  }
  setLoading(true);
  const { data: serialData, error: serialError } = await sb.rpc("issue_serial", {
    p_category: category, p_type: type, p_brand: brand, p_model_code: modelCode,
    p_display_name: displayName, p_spec_json: {},
  });
  if (serialError) { setLoading(false); toast("Could not generate serial: " + serialError.message); return; }
  const row = serialData[0];
  const tags = (document.getElementById("s-tags").value || "").split(",").map(t => t.trim()).filter(Boolean);
  const { error: insertError } = await sb.from("items").insert({
    serial: row.serial, model_id: row.model_id, unit_id: row.unit_id,
    purchase_date: document.getElementById("s-purchase-date").value || null,
    price: document.getElementById("s-price").value ? Number(document.getElementById("s-price").value) : null,
    condition: document.getElementById("s-condition").value || null,
    notes: document.getElementById("s-notes").value || null,
    location_id: _editLocationId,
    status: "idle",
    tier: _editTier,
    tags,
    photo_url: _editImageData || null,
  });
  setLoading(false);
  if (insertError) { toast("Serial generated (" + row.serial + ") but saving failed: " + insertError.message); return; }
  await loadAll();
  closeSheet();
  toast(`Added ${row.serial}`);
  render();
}

function openEditItemSheet(itemId) {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  _editItemId = itemId; _editTier = item.tier || "C"; _editImageData = null; _removeExistingPhoto = false;
  const loc = item.location_id ? locationById(item.location_id) : null;
  const sortedLocs = [...locations].sort((a,b) => breadcrumbNames(a.id).join(" › ").localeCompare(breadcrumbNames(b.id).join(" › ")));
  const locOptions = `<option value="">— Unassigned —</option>` + sortedLocs.map(l => `<option value="${l.id}" ${item.location_id===l.id?"selected":""}>${escapeHtml(breadcrumbNames(l.id).join(" › "))}</option>`).join("");
  openSheet(`
    <div class="sheet-title">Edit item</div>
    <div class="sheet-label">${escapeHtml(item.serial || "")}</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:14px">${escapeHtml(item.name)}</div>
    ${tierGridHTML()}
    <input class="sheet-input" id="s-tags" value="${escapeHtml((item.tags||[]).join(", "))}" placeholder="Tags, comma separated">
    <span class="sheet-label" style="margin-bottom:5px;display:block">Location</span>
    <select class="sheet-input" id="s-location">${locOptions}</select>
    <div class="sheet-row-2">
      <input class="sheet-input" id="s-purchase-date" type="date" value="${item.purchase_date||""}">
      <input class="sheet-input" id="s-price" type="number" placeholder="Price (CZK)" value="${item.price||""}">
    </div>
    <input class="sheet-input" id="s-condition" placeholder="Condition" value="${escapeHtml(item.condition||"")}">
    <textarea class="sheet-input" id="s-notes" placeholder="Notes…" rows="3">${escapeHtml(item.notes||"")}</textarea>
    ${item.photo_url ? `<img class="img-preview-small" src="${item.photo_url}"><button type="button" class="remove-img-btn" onclick="removePendingImg()">Remove photo</button>` : `<button type="button" class="img-upload-btn" id="img-upload-btn-el" onclick="document.getElementById('s-img-input').click()">${svgIcon("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",14,0.7)} Add photo</button>`}
    <input type="file" id="s-img-input" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
    <div id="s-img-preview"></div>
    <div class="sheet-btn-row">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-confirm" style="background:${loc?locationColor(loc):'#4CC9F0'}" onclick="submitEditItem()">Save</button>
    </div>`);
}
async function submitEditItem() {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === _editItemId);
  if (!item) return;
  const tags = (document.getElementById("s-tags").value || "").split(",").map(t => t.trim()).filter(Boolean);
  const newLocationId = document.getElementById("s-location").value || null;
  const updates = {
    purchase_date: document.getElementById("s-purchase-date").value || null,
    price: document.getElementById("s-price").value ? Number(document.getElementById("s-price").value) : null,
    condition: document.getElementById("s-condition").value || null,
    notes: document.getElementById("s-notes").value || null,
    location_id: newLocationId,
    tier: _editTier,
    tags,
  };
  if (_editImageData) updates.photo_url = _editImageData;
  else if (_removeExistingPhoto) updates.photo_url = null;
  setLoading(true);
  const { error } = await sb.from("items").update(updates).eq("id", item.id);
  if (!error && newLocationId !== item.location_id) {
    const destName = newLocationId ? breadcrumbNames(newLocationId).join(" › ") : "Unassigned";
    await sb.from("item_events").insert({ item_id: item.id, event_type: "moved", detail: `Moved to ${destName}` });
  }
  setLoading(false);
  if (error) { toast("Could not save: " + error.message); return; }
  await loadAll();
  closeSheet();
  toast("Saved");
  activeItemId = item.id; view = "item"; render();
}
function deleteItemConfirm(itemId) {
  if (!requireEdit()) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  if (!confirm(`Delete ${item.serial} (${item.name}) permanently? This can't be undone.`)) return;
  (async () => {
    setLoading(true);
    await sb.from("item_events").delete().eq("item_id", itemId);
    const { error } = await sb.from("items").delete().eq("id", itemId);
    setLoading(false);
    if (error) { toast("Could not delete: " + error.message); return; }
    await loadAll();
    toast("Deleted");
    goBack();
  })();
}

// ============================================================
// QR / BARCODE SCANNING
// ============================================================
function openScanner() {
  document.getElementById("scan-overlay").classList.add("show");
  html5QrCode = new Html5Qrcode("qr-reader", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
    ],
    verbose: false,
  });
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    onScanSuccess,
    () => {} // ignore per-frame "not found" noise
  ).catch(err => {
    toast("Camera unavailable: " + (err?.message || err));
    closeScanner();
  });
}
function closeScanner() {
  document.getElementById("scan-overlay").classList.remove("show");
  if (html5QrCode) {
    html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
    html5QrCode = null;
  }
}
function onScanSuccess(decodedText) {
  const code = (decodedText || "").trim();
  closeScanner();
  const item = items.find(i => (i.serial || "").toLowerCase() === code.toLowerCase());
  if (!item) { toast(`No item found for "${code}"`); return; }
  openItem(item.id);
}
