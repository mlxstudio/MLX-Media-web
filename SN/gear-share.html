<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLX Media — Gear list</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#090B0E;--panel:#12151A;--panel2:#1A1E25;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--text:#F4F6F8;--dim:rgba(244,246,248,.66);--faint:rgba(244,246,248,.4);--accent:#4CC9F0;--on:#04121a;--green:#06D6A0;--head:rgba(9,11,14,.94);--barbg:rgba(18,21,26,.96);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color-scheme:dark;--accent-bg:color-mix(in srgb,var(--accent) 12%,transparent)}
:root[data-theme=light]{--bg:#F3F4F7;--panel:#fff;--panel2:#ECEEF2;--line:rgba(10,20,30,.09);--line2:rgba(10,20,30,.18);--text:#12151A;--dim:rgba(18,21,26,.68);--faint:rgba(18,21,26,.46);--green:#059669;--head:rgba(243,244,247,.94);--barbg:rgba(255,255,255,.96);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:200px}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#head{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:21px;font-weight:750;letter-spacing:-.01em}
.brand small{font-size:12.5px;color:var(--faint);white-space:nowrap}
.brand small b{color:var(--accent);font-weight:700}
#sub{font-size:13px;color:var(--dim);margin-top:2px}
.search{position:relative;margin-top:11px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
#search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 38px 11px 38px;font-size:15px;outline:none}
#search:focus{border-color:var(--accent)}
#search-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--faint);font-size:20px;width:32px;height:32px;display:none}
#chips{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 2px;margin:0 -16px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 10px;font-size:13.5px;font-weight:600;color:var(--dim);transition:background-color .15s,border-color .15s,color .15s}
.chip .n{font-size:12px;font-weight:600;color:var(--faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip.on .n{color:color-mix(in srgb,var(--on) 65%,transparent)}
.tools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{background:none;border:0;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--faint)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.tbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--dim)}
.tbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tools .grow{flex:1}
#main{max-width:860px;margin:0 auto;padding:6px 16px 150px}
.group-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px;position:relative}
.group-head .gi{font-size:20px}
.group-head h2{font-size:16.5px;font-weight:700}
.group-head .cnt{font-size:12.5px;color:var(--faint)}
.group-head .sp{flex:1}
.group-head button{background:none;border:0;font-size:13px;font-weight:600;color:var(--accent);padding:6px 4px}
.group-head .fold{color:var(--faint);font-size:16px;width:28px;transition:transform .2s}
.group.closed .fold{transform:rotate(-90deg)}
.group.closed .grid{display:none}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;user-select:none;transition:border-color .15s,background-color .15s}
.card:hover{border-color:var(--line2)}
.card.on{border-color:var(--accent);background:var(--accent-bg)}
.tick{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:1px;transition:background-color .15s,border-color .15s}
.tick svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:opacity .15s,transform .18s cubic-bezier(.34,1.56,.64,1)}
.card.on .tick{background:var(--accent);border-color:var(--accent)}
.card.on .tick svg{opacity:1;transform:none}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:6px;align-items:center}
.tag{font-size:12px;color:var(--dim);background:var(--panel2);border-radius:7px;padding:2px 8px}
.tag.serial{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.tag.st{color:var(--green);background:rgba(6,214,160,.1)}
.tag.cat{background:var(--accent-bg);color:var(--accent)}
.notes{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.lnks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--accent);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:9px;padding:6px 11px;text-decoration:none;transition:background-color .15s,transform .15s}
.lnk:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}.lnk:active{transform:scale(.96)}
.lnk svg{width:13px;height:13px}
.qr{flex:none;width:58px;height:58px;background:#fff;border-radius:9px;padding:4px}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
#empty{text-align:center;color:var(--faint);padding:56px 20px}
#empty p{margin-bottom:14px}
#empty button{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 16px;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--barbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.16,1,.3,1)}
#bar.show{transform:none}
#bar .wrap{display:flex;align-items:center;gap:12px}
#bar-txt{flex:1;font-size:14px;color:var(--dim)}
#bar-txt b{color:var(--text);font-size:16px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on)}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:var(--panel2);color:var(--dim)}
#sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet-bg.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .3s cubic-bezier(.16,1,.3,1);max-width:640px;margin:0 auto}
#sheet.open{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.sheet-h h3{font-size:18px}
.sheet-h button{background:var(--panel2);border:0;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--dim)}
#sheet-list{overflow-y:auto;padding:0 18px;flex:1;min-height:60px}
.sel-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sel-row span{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.sel-row small{display:block;font-size:12px;color:var(--faint)}
.sel-row button{background:none;border:0;color:var(--faint);font-size:20px;width:34px;height:34px}
.sheet-f{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line)}
.sheet-f input,.sheet-f textarea{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;outline:none;width:100%}
.sheet-f input:focus,.sheet-f textarea:focus{border-color:var(--accent)}
.sheet-f textarea{resize:none;min-height:58px}
.sheet-f .btn{width:100%}
#screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:30px;text-align:center}
#screen h2{font-size:22px;margin-bottom:8px}
#screen p{color:var(--faint);max-width:320px;margin:0 auto}
.bigcheck{width:64px;height:64px;border-radius:50%;background:rgba(6,214,160,.14);color:var(--green);display:grid;place-items:center;margin:0 auto 18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body::before{content:"";position:fixed;inset:0 0 auto;height:340px;background:radial-gradient(55% 100% at 50% 0,var(--accent-bg),transparent);pointer-events:none;z-index:-1}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{45%{transform:scale(1.22)}}
@keyframes bump{40%{transform:scale(1.4)}}
@keyframes shim{to{background-position:-200% 0}}
.card{animation:rise .45s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(min(var(--i,0),14)*28ms)}
.card:active{transform:scale(.985)}
.group-head{animation:rise .4s cubic-bezier(.16,1,.3,1) backwards}
.card.on .tick{animation:pop .32s}
.tick svg{color:var(--on)}
#bar-n.bump{display:inline-block;animation:bump .3s}
.brand .r{display:flex;align-items:center;gap:12px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--dim);display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover{transform:rotate(20deg)}.icon-btn svg{width:17px;height:17px}
.group-head .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:hsl(var(--h) 70% 55%/.16)}
.tag.cat{background:hsl(var(--h) 70% 55%/.16);color:var(--text)}
.skel{height:66px;border-radius:14px;margin:8px 0;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:shim 1.3s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:14px;align-items:center;transition:opacity .25s,transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:800;filter:brightness(.8)}
.bigcheck{animation:pop .6s .1s backwards}#screen h2,#screen p{animation:rise .5s .2s backwards}
#bar .tbtn{flex:none}
</style>
</head>
<body>

<div id="head" style="display:none">
  <div class="wrap">
    <div class="brand"><h1 id="title">Gear list</h1><div class="r"><small>MLX <b>Media</b></small><button class="icon-btn" id="theme" aria-label="Switch theme"></button></div></div>
    <p id="sub">Tick what you'd like for the shoot, then send it over.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search name, serial or category" autocomplete="off">
      <button id="search-x" aria-label="Clear search">×</button>
    </div>
    <div id="chips"></div>
    <div class="tools">
      <div class="seg" id="sort"><button data-s="cat" class="on">By category</button><button data-s="az">A–Z</button></div>
      <button class="tbtn" id="selonly">Selected only</button>
      <span class="grow"></span>
      <button class="tbtn" id="selall">Select all shown</button>
    </div>
  </div>
</div>

<div id="skeleton" class="wrap" style="padding-top:96px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<div id="main" style="display:none"></div>
<div id="toast"></div>
<div id="screen"></div>

<div id="bar"><div class="wrap">
  <div id="bar-txt"><b id="bar-n">0</b> selected</div>
  <button class="tbtn" id="clear">Clear</button>
  <button class="btn primary" id="review">Review &amp; send</button>
</div></div>

<div id="sheet-bg"></div>
<div id="sheet" role="dialog" aria-label="Your selection">
  <div class="sheet-h"><h3>Your selection (<span id="sheet-n">0</span>)</h3><button id="sheet-x" aria-label="Close">×</button></div>
  <div id="sheet-list"></div>
  <div class="sheet-f">
    <input id="cname" placeholder="Your name" autocomplete="name">
    <textarea id="cnote" placeholder="Anything else to add? (optional)"></textarea>
    <button class="btn ghost" id="copy">Copy list</button>
    <button class="btn primary" id="send">Send to MLX Media</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://depprbklgspiawqhnuev.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_lVIYRLl-dosIn7XvKWrxOg_PC3oT7t-";
const LOOKUP_BASE_URL="https://mlxmedia.cz/gear/lookup.html?s=";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const token=new URLSearchParams(location.search).get("t");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
let link=null,items=[],byId=new Map(),sel=new Set(),cat="all",sort="cat",selOnly=false,q="",folded=new Set();
const KEY="mlx-share-"+token;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const ICONS=[[/illum/,"💡"],[/wireless/,"📡"],[/camera|kamer|body/,"📷"],[/lens|objektiv|optic/,"🔭"],[/audio|sound|mic|zvuk|mikro/,"🎙️"],[/light|svět|led/,"💡"],[/tripod|stativ|support|grip|rig|slider/,"📐"],[/gimbal|stabil/,"🌀"],[/drone|dron/,"🚁"],[/monitor|screen|display/,"🖥️"],[/batter|power|akum|napáj|charger/,"🔋"],[/storage|card|disk|ssd|media|pam/,"💾"],[/cable|kabel|adapter/,"🔌"],[/computer|laptop|pc/,"💻"],[/filter/,"🔘"],[/bag|case|kufr|brašn/,"🎒"]];
const icon=c=>{const l=(c||"").toLowerCase();for(const[r,e]of ICONS)if(r.test(l))return e;return"📦"};
const STARTER={C:"Camera",L:"Lens",W:"Wireless",P:"Power",G:"Grip",T:"Tripod/Support",I:"Illumination",A:"Audio",S:"Stabilizer"};
const ORDER=["Camera","Lens","Audio","Illumination","Tripod/Support","Stabilizer","Grip","Power","Wireless"];
const catOf=i=>i.category?((link.fields&&link.fields.catNames&&link.fields.catNames[i.category])||STARTER[i.category]||i.category):"Other";
const rank=c=>{const r=ORDER.indexOf(c);return r<0?99:r};
const sortCat=(a,b)=>rank(a)-rank(b)||cmp(a,b);
const hue=c=>[...c].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%360,7);
let cardN=0;
const fieldOn=k=>!!(link.fields&&link.fields[k]);
const cmp=(a,b)=>String(a).localeCompare(String(b),"cs",{numeric:true,sensitivity:"base"});

function showScreen(html){const k=$("skeleton");if(k)k.remove();$("head").style.display="none";$("main").style.display="none";$("bar").classList.remove("show");const s=$("screen");s.style.display="flex";s.innerHTML=html}

async function init(){
  if(!token)return showScreen(`<div><h2>No list here</h2><p>This link is missing its code. Ask MLX Media for a fresh one.</p></div>`);
  const{data:l,error}=await sb.rpc("get_share_link",{p_token:token});
  if(error||!l||!l.length)return showScreen(`<div><h2>This link isn't active</h2><p>It may have been turned off or deleted. Ask MLX Media for a new one.</p></div>`);
  link=l[0];
  const ac=(link.fields&&link.fields.accent)||"";
  if(/^#[0-9a-f]{6}$/i.test(ac)){const r=document.documentElement.style,n=parseInt(ac.slice(1),16);r.setProperty("--accent",ac);r.setProperty("--on",((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)>150?"#04121a":"#fff")}
  applyTheme(store.get("mlx-theme")||(link.fields&&link.fields.theme)||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
  const{data,error:ie}=await sb.rpc("get_share_items",{p_token:token});
  if(ie)return showScreen(`<div><h2>Couldn't load the gear list</h2><p>${esc(ie.message)}</p></div>`);
  items=data||[];items.forEach(i=>byId.set(i.id,i));
  try{JSON.parse(store.get(KEY)||"[]").forEach(id=>byId.has(id)&&sel.add(id))}catch(e){}
  $("cname").value=store.get("mlx-share-name")||"";
  $("title").textContent=link.title||"Gear list";
  const k=$("skeleton");if(k)k.remove();$("head").style.display="";$("main").style.display="";
  render();updateBar();
}

function matches(i,ignoreCat){
  if(!ignoreCat&&cat!=="all"&&catOf(i)!==cat)return false;
  if(!q)return true;
  return [i.name,i.serial,catOf(i),i.notes].some(v=>(v||"").toLowerCase().includes(q));
}
const shown=()=>items.filter(i=>matches(i)&&(!selOnly||sel.has(i.id)));

function renderChips(){
  if(!fieldOn("category")){$("chips").style.display="none";$("sort").style.display="none";return}
  const counts=new Map();let total=0;
  items.forEach(i=>{if(matches(i,true)){counts.set(catOf(i),(counts.get(catOf(i))||0)+1);total++}});
  if(cat!=="all"&&!counts.has(cat))counts.set(cat,0);
  const all=[["all","All","✨",total],...[...counts.keys()].sort(sortCat).map(c=>[c,c,icon(c),counts.get(c)])];
  $("chips").innerHTML=all.map(([k,label,ic,n])=>`<button class="chip${cat===k?" on":""}" data-c="${esc(k)}">${k==="all"?"":ic}<span>${esc(label)}</span><span class="n">${n}</span></button>`).join("");
}

const EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
function linksHtml(i){
  if(!fieldOn("links")||!Array.isArray(i.links))return"";
  const a=i.links.filter(l=>l&&/^https?:\/\//i.test(l.url||"")).map(l=>`<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||"Link")}${EXT}</a>`);
  return a.length?`<div class="lnks">${a.join("")}</div>`:"";
}
function card(i,showCat){
  const t=[];
  if(showCat&&fieldOn("category"))t.push(`<span class="tag cat" style="--h:${hue(catOf(i))}">${icon(catOf(i))} ${esc(catOf(i))}</span>`);
  if(fieldOn("serial")&&i.serial)t.push(`<span class="tag serial">${esc(i.serial)}</span>`);
  if(fieldOn("status")&&i.status)t.push(`<span class="tag st">${esc(i.status.replace(/_/g," "))}</span>`);
  if(fieldOn("location")&&i.location_name)t.push(`<span class="tag">${esc(i.location_name)}</span>`);
  return `<div class="card${sel.has(i.id)?" on":""}" style="--i:${cardN++}" data-id="${esc(i.id)}" role="checkbox" aria-checked="${sel.has(i.id)}" tabindex="0">
    <span class="tick">${tick}</span>
    <div class="body"><div class="name">${esc(i.name)}</div>${t.length?`<div class="tags">${t.join("")}</div>`:""}${fieldOn("notes")&&i.notes?`<div class="notes">${esc(i.notes)}</div>`:""}${linksHtml(i)}</div>
    ${fieldOn("qr")&&i.serial?`<div class="qr" id="qr-${esc(i.id)}"></div>`:""}
  </div>`;
}

function render(){
  cardN=0;renderChips();
  const list=shown(),main=$("main");
  $("selonly").classList.toggle("on",selOnly);
  $("selonly").textContent=selOnly?`Selected only (${sel.size})`:"Selected only";
  if(!list.length){
    const filtering=q||cat!=="all"||selOnly;
    main.innerHTML=`<div id="empty"><p>${items.length?(selOnly&&!sel.size?"Nothing selected yet.":"Nothing matches these filters."):"Nothing here yet."}</p>${filtering?'<button id="reset">Clear filters</button>':""}</div>`;
    return;
  }
  let html="";
  if(sort==="cat"&&fieldOn("category")){
    const g=new Map();list.forEach(i=>{const k=catOf(i);(g.get(k)||g.set(k,[]).get(k)).push(i)});
    [...g.keys()].sort(sortCat).forEach(k=>{
      const arr=g.get(k).sort((a,b)=>cmp(a.name,b.name)),all=arr.every(i=>sel.has(i.id));
      html+=`<section class="group${folded.has(k)?" closed":""}" data-g="${esc(k)}">
        <div class="group-head"><span class="gi" style="--h:${hue(k)}">${icon(k)}</span><h2>${esc(k)}</h2><span class="cnt">${arr.length}</span><span class="sp"></span>
        <button data-all="${esc(k)}">${all?"Deselect all":"Select all"}</button><button class="fold" data-fold="${esc(k)}" aria-label="Collapse">▾</button></div>
        <div class="grid">${arr.map(i=>card(i,false)).join("")}</div></section>`;
    });
  }else{
    html=`<div class="grid" style="margin-top:14px">${[...list].sort((a,b)=>cmp(a.name,b.name)).map(i=>card(i,true)).join("")}</div>`;
  }
  main.innerHTML=html;
  if(fieldOn("qr")&&typeof QRCode!=="undefined")list.forEach(i=>{
    const h=i.serial&&$("qr-"+i.id);
    if(h)try{new QRCode(h,{text:LOOKUP_BASE_URL+encodeURIComponent(i.serial),width:50,height:50,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  });
}

function save(){store.set(KEY,JSON.stringify([...sel]))}
function setCard(id){
  const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(el){el.classList.toggle("on",sel.has(id));el.setAttribute("aria-checked",sel.has(id))}
}
function toggle(id){sel.has(id)?sel.delete(id):sel.add(id);setCard(id);afterChange()}
function afterChange(){
  save();updateBar();
  $("selonly").textContent=selOnly?`Selected only (${sel.size})`:"Selected only";
  document.querySelectorAll("[data-all]").forEach(b=>{
    const k=b.dataset.all,arr=items.filter(i=>catOf(i)===k&&matches(i));
    b.textContent=arr.length&&arr.every(i=>sel.has(i.id))?"Deselect all":"Select all";
  });
  if($("sheet").classList.contains("open"))renderSheet();
}
function updateBar(){const bn=$("bar-n");bn.textContent=sel.size;bn.classList.remove("bump");void bn.offsetWidth;bn.classList.add("bump");$("bar").classList.toggle("show",sel.size>0)}

function renderSheet(){
  $("sheet-n").textContent=sel.size;
  $("sheet-list").innerHTML=[...sel].map(id=>byId.get(id)).filter(Boolean).sort((a,b)=>cmp(catOf(a)+a.name,catOf(b)+b.name))
    .map(i=>`<div class="sel-row"><span>${esc(i.name)}${fieldOn("category")?`<small>${icon(catOf(i))} ${esc(catOf(i))}</small>`:""}</span><button data-rm="${esc(i.id)}" aria-label="Remove">×</button></div>`).join("");
  if(!sel.size)closeSheet();
}
function openSheet(){renderSheet();$("sheet").classList.add("open");$("sheet-bg").classList.add("open")}
function closeSheet(){$("sheet").classList.remove("open");$("sheet-bg").classList.remove("open")}

async function submit(){
  const name=$("cname").value.trim();
  if(!name){$("cname").focus();return}
  const btn=$("send");btn.disabled=true;btn.textContent="Sending…";
  const{error}=await sb.rpc("submit_share_selection",{p_token:token,p_client_name:name,p_item_ids:[...sel],p_note:$("cnote").value.trim()||null});
  if(error){btn.disabled=false;btn.textContent="Send to MLX Media";alert("Couldn't send: "+error.message);return}
  store.set("mlx-share-name",name);store.del(KEY);closeSheet();
  showScreen(`<div><div class="bigcheck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><h2>Sent!</h2><p>${esc(name.split(" ")[0])}, your list is on its way. MLX Media will follow up with you directly.</p></div>`);
}

let t;
$("search").addEventListener("input",e=>{clearTimeout(t);$("search-x").style.display=e.target.value?"block":"none";t=setTimeout(()=>{q=e.target.value.trim().toLowerCase();render()},150)});
$("search-x").onclick=()=>{$("search").value="";q="";$("search-x").style.display="none";render()};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;render();scrollTo({top:0})}};
$("sort").onclick=e=>{const b=e.target.closest("button");if(!b)return;sort=b.dataset.s;document.querySelectorAll("#sort button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("selonly").onclick=()=>{selOnly=!selOnly;render()};
$("selall").onclick=()=>{const l=shown();const all=l.length&&l.every(i=>sel.has(i.id));l.forEach(i=>all?sel.delete(i.id):sel.add(i.id));render();afterChange();$("selall").textContent=all?"Select all shown":"Deselect shown"};
$("main").onclick=e=>{
  if(e.target.closest(".lnks"))return;
  const f=e.target.closest("[data-fold]");
  if(f){const k=f.dataset.fold;folded.has(k)?folded.delete(k):folded.add(k);f.closest(".group").classList.toggle("closed");return}
  const a=e.target.closest("[data-all]");
  if(a){const arr=items.filter(i=>catOf(i)===a.dataset.all&&matches(i)),all=arr.every(i=>sel.has(i.id));arr.forEach(i=>{all?sel.delete(i.id):sel.add(i.id);setCard(i.id)});afterChange();return}
  if(e.target.id==="reset"){q="";cat="all";selOnly=false;$("search").value="";$("search-x").style.display="none";render();return}
  const c=e.target.closest(".card");if(c)toggle(c.dataset.id);
};
$("main").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();toggle(e.target.dataset.id)}};
$("review").onclick=openSheet;$("sheet-x").onclick=closeSheet;$("sheet-bg").onclick=closeSheet;
$("sheet-list").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){sel.delete(b.dataset.rm);setCard(b.dataset.rm);afterChange();if(selOnly)render()}};
$("send").onclick=submit;
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){document.documentElement.dataset.theme=t;$("theme").innerHTML=t==="dark"?SUN:MOON}
$("theme").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(t);store.set("mlx-theme",t)};
let tt;function toast(m,label,fn){const t=$("toast");t.innerHTML=`<span>${esc(m)}</span>`+(label?`<button>${label}</button>`:"");if(label)t.querySelector("button").onclick=()=>{fn();t.classList.remove("show")};t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),5000)}
$("clear").onclick=()=>{const prev=[...sel];sel.clear();save();render();updateBar();toast("Selection cleared","Undo",()=>{prev.forEach(id=>sel.add(id));save();render();updateBar()})};
$("copy").onclick=async()=>{const g={};[...sel].map(id=>byId.get(id)).filter(Boolean).forEach(i=>(g[catOf(i)]=g[catOf(i)]||[]).push(i.name));const txt=Object.keys(g).sort(sortCat).map(c=>c+"\n"+g[c].sort(cmp).map(n=>"• "+n).join("\n")).join("\n\n");try{await navigator.clipboard.writeText(txt);toast("List copied")}catch(e){toast("Couldn't copy")}};
addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("search").focus()}if(e.key==="Escape"){closeSheet();if(document.activeElement===$("search"))$("search").blur()}});
init();
</script>
</body>
</html>
