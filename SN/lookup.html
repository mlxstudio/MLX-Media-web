<style>
:root{color-scheme:dark;--bg:#0f1419;--s1:#171d24;--s2:#1f2730;--line:rgba(255,255,255,.09);--tx:#f3f6f8;--tx2:rgba(243,246,248,.66);--tx3:rgba(243,246,248,.4);--ac:#4CC9F0;--acink:#03141a;--glass:rgba(15,20,25,.82);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--ui);min-height:100dvh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;padding-bottom:max(28px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font:800 18px var(--disp);letter-spacing:-.3px;color:var(--tx);text-decoration:none}.brand b{color:var(--ac)}
.hb{display:flex;gap:6px;align-items:center}
.ib{height:38px;min-width:38px;padding:0 10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;transition:transform .15s var(--ease),background .2s}
.ib:active{transform:scale(.94)}
.av{width:38px;padding:0;background:var(--ac);color:var(--acink);border:0;font-weight:800}
.search{position:relative;padding-bottom:12px}
.sf{display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.sf:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.sf>svg{color:var(--tx3)}
.sf input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px;font-family:var(--mono);font-weight:500;letter-spacing:.3px}
.sf input::placeholder{font-family:var(--ui);letter-spacing:0;color:var(--tx3);font-weight:400}
.scanbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--ac);color:var(--acink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;transition:transform .15s var(--ease)}
.scanbtn:active{transform:scale(.94)}
.sugg{position:absolute;left:0;right:0;top:58px;background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;opacity:0;transform:translateY(-6px) scale(.985);visibility:hidden;transition:.18s var(--ease);transform-origin:top}

.sugg button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border:0}.sugg button:hover,.sugg button.act{background:var(--s2)}
.sugg .s{font:700 13px var(--mono)}.sugg .n{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sugg .t{min-width:0;flex:1}
/* tally light */
.tally{--c:var(--idle);width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 24%,transparent),0 0 12px var(--c);flex:none}
.tally.live{animation:breathe 1.8s ease-in-out infinite}.tally.bad{animation:breathe .9s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 10%,transparent),0 0 18px var(--c);opacity:.75}}
/* home */
.home{padding:34px 0 10px;text-align:center}
.bigscan{position:relative;width:128px;height:128px;border-radius:50%;margin:6px auto 22px;background:var(--ac);color:var(--acink);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 36px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .2s var(--ease)}
.bigscan:active{transform:scale(.94)}
.bigscan svg{width:52px;height:52px}
.bigscan::before,.bigscan::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);animation:ring 2.6s ease-out infinite}

@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.7);opacity:0}}
.home h1{font:800 26px/1.15 var(--disp);letter-spacing:-.5px;margin-bottom:6px}
.home p{color:var(--tx2);font-size:14.5px}
.rec{margin-top:30px;text-align:left}
.rec h2,.sec{font:700 13px var(--ui);color:var(--tx3);margin:0 2px 8px;display:flex;justify-content:space-between}
.rec h2 button{font-size:12.5px;color:var(--tx3)}
.ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;transition:transform .15s var(--ease),border-color .2s}
.ritem:hover{border-color:var(--ac)}.ritem:active{transform:scale(.985)}
.ritem .s{font:700 13px var(--mono)}.ritem .n{font-size:13px;color:var(--tx2)}

.res{display:grid;gap:16px;padding-top:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px}
.hero{padding:12px 12px 18px}
.vf{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--s2)}
.vf img{width:100%;height:100%;object-fit:cover;display:block}
.vf .ph{height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}

.vf i:nth-of-type(1){top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.vf i:nth-of-type(2){top:10px;right:10px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.vf i:nth-of-type(3){bottom:10px;left:10px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.vf i:nth-of-type(4){bottom:10px;right:10px;border-left:0;border-top:0;border-bottom-right-radius:6px}
@keyframes lock{from{transform:scale(1.5);opacity:0}}
.stat{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:9px;padding:7px 13px 7px 11px;border-radius:999px;background:rgba(8,12,16,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:13px}
.hd{padding:16px 6px 0}
.sn{display:flex;align-items:center;gap:8px;font:700 13px var(--mono);color:var(--ac);letter-spacing:.8px}

.nm{font:800 26px/1.12 var(--disp);letter-spacing:-.6px;margin:6px 0 12px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:999px;background:var(--s2);font-size:12.5px;font-weight:600;color:var(--tx2)}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--damaged)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--ac);color:var(--acink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.96)}.btn.g{background:var(--s2);color:var(--tx)}
/* tabs */
.tabs{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));background:var(--s2);border-radius:10px;transform:translateX(calc(var(--i)*100%));transition:transform .32s var(--ease)}
.tabs button{position:relative;height:40px;font-weight:700;font-size:13.5px;color:var(--tx3);display:flex;align-items:center;justify-content:center;gap:5px;transition:color .2s}
.tabs button.on{color:var(--tx)}.tabs svg.i{width:14px;height:14px}
.pn{display:none}.pn.on{display:block;animation:pin .32s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.pn .card{margin-bottom:12px}
.card h3{font:700 13px var(--ui);color:var(--tx3);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0;padding-top:0}.row .k{color:var(--tx3);flex:none}.row .v{text-align:right;overflow-wrap:anywhere;font-weight:500}
.steps{list-style:none}
.steps li{display:flex;align-items:center;gap:11px;padding:7px 0;margin-left:calc(var(--d)*18px);font-weight:600;font-size:15px;opacity:0;animation:pin .4s var(--ease) forwards;animation-delay:calc(var(--d)*90ms)}
.nd{width:11px;height:11px;border-radius:50%;border:2px solid var(--tx3);flex:none}
.steps li.cur .nd{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
.steps li.cur{color:var(--ac)}
.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.6}
.found{border-left:4px solid var(--ac)}.found p{color:var(--tx2);font-size:14px;margin-bottom:12px}
.empty{color:var(--tx2);font-size:14.5px}
.tag{background:#fff;color:#000;border-radius:16px;padding:18px;display:grid;justify-items:center;gap:12px;text-align:center}
.tag b{font:800 15px var(--disp)}.tag .m{font:700 14px var(--mono);letter-spacing:1px}
.tag #qr{line-height:0}.tag #bar{max-width:100%}
.lock{text-align:center;padding:26px 18px}.lock svg.i{width:30px;height:30px;color:var(--ac);margin-bottom:10px}
.lock p{color:var(--tx2);font-size:14.5px;margin-bottom:14px}
.msg{text-align:center;padding:40px 18px;color:var(--tx2)}.msg b{font-family:var(--mono);color:var(--tx)}
.msg small{display:block;margin-top:8px;color:var(--tx3)}
/* skeleton */
.sk{border-radius:14px;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
/* reveal */
.rv{animation:pin .5s var(--ease) both;animation-delay:calc(var(--r,0)*70ms)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
.sheet.open{visibility:visible;opacity:1}
.panel{background:var(--s1);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .38s var(--ease)}
.sheet.open .panel{transform:none}
.panel h3{font:800 20px var(--disp);margin-bottom:14px}
.panel input{width:100%;height:50px;padding:0 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;outline:0}
.panel input:focus{border-color:var(--ac)}.panel .btn{width:100%}

/* scanner */
.scanov{position:fixed;inset:0;z-index:70;background:#000;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
.scanov.open{visibility:visible;opacity:1}
.scanov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.frame{position:absolute;z-index:2;left:50%;top:46%;width:min(72vw,300px);aspect-ratio:1;transform:translate(-50%,-50%)}
.frame i{position:absolute;width:38px;height:38px;border:4px solid #fff;transition:border-color .2s}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:16px}

.frame.ok i{border-color:var(--ok)}.frame.ok b{background:var(--ok);box-shadow:0 0 14px var(--ok);animation:none}
.sctop,.scbot{position:absolute;z-index:3;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.sctop{top:max(18px,env(safe-area-inset-top))}.scbot{bottom:max(28px,env(safe-area-inset-bottom));justify-content:center;gap:12px}
.sc-btn{height:46px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}

.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:860px){.res{grid-template-columns:340px 1fr;align-items:start;gap:22px;padding-top:26px}.hero{position:sticky;top:130px}.home{padding-top:60px}}
@media print{body.pt .top,body.pt .hero,body.pt .tabs,body.pt .pn:not(#p-tg),body.pt .noprint,body.pt .toast{display:none!important}body.pt{background:#fff}body.pt .res{display:block}body.pt .pn{display:block}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.steps li{opacity:1}}
</style>

const ic = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const IC = {copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',print:'<path d="M6 9V3h12v6M6 18H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-2"/><rect x="6" y="14" width="12" height="7"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',scan:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/>'};
const STATUS = {idle:{l:"Idle",c:"var(--idle)"},in_use:{l:"In use",c:"var(--in_use)",live:1},on_set:{l:"On set",c:"var(--on_set)",live:1},borrowed:{l:"Borrowed",c:"var(--borrowed)"},damaged:{l:"Damaged",c:"var(--damaged)",bad:1},repaired:{l:"Repaired",c:"var(--repaired)"}};
const CAT = {C:["🎥","Camera"],L:["🔎","Lens"],W:["📡","Wireless"],P:["🔋","Power"],G:["🛠️","Grip"],T:["📐","Support"],I:["💡","Lighting"],A:["🎙️","Audio"]};
const ALPHA = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? esc(u) : "";
const fmtDate = d => d ? new Date(d).toLocaleDateString("cs-CZ") : "";
const fmtMoney = n => n == null || n === "" ? "" : Number(n).toLocaleString("cs-CZ") + " CZK";
const days = d => Math.round((new Date(d) - new Date()) / 864e5);
const tally = (S) => `<span class="tally ${S.live?"live":""} ${S.bad?"bad":""}" style="--c:${S.c}"></span>`;
let session = null, role = null, currentSerial = "", reqId = 0, tab = "ov", lastSugg = [];

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const clean = s => (s||"").trim().toUpperCase().replace(/[^0-9A-Z]/g,"");

/* ---- Routing: ?s=SERIAL, #SERIAL, or /gear/SERIAL (via 404.html) ---- */
function serialFromUrl(){
  const p = new URLSearchParams(location.search);
  let s = p.get("s") || p.get("serial") || decodeURIComponent(location.hash.slice(1));
  if(!s){const m=location.pathname.match(/\/gear\/([^\/.]+)\/?$/);if(m)s=decodeURIComponent(m[1])}
  return clean(s);
}
function go(serial, push=true){
  serial = clean(serial); if(!serial) return;
  $("q").value = serial; hideSugg(); $("q").blur();
  if(serial!==currentSerial) tab="ov";
  if(push){const u=new URL(location.href);u.search="?s="+serial;u.hash="";history.pushState({},"",u)}
  load(serial);
}
function goHome(push=true){
  currentSerial="";$("q").value="";hideSugg();document.title="MLX Gear — Lookup";
  if(push){const u=new URL(location.href);u.search="";u.hash="";history.pushState({},"",u)}
  home();scrollTo({top:0})
}
$("brand").onclick=e=>{e.preventDefault();goHome()};
window.addEventListener("popstate",()=>{const s=serialFromUrl();s?load(s):goHome(false)});
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const a=$("sugg").querySelector(".act"), v=$("q").value.trim();
  if(a)return go(a.dataset.s);
  if(/^[0-9A-Za-z]{6,}$/.test(v)||!lastSugg.length)return go(v);
  go(lastSugg[0].serial);
});

/* ---- Autocomplete ---- */
let st, sel=-1;
function hideSugg(){$("sugg").classList.remove("open");sel=-1}
$("q").addEventListener("input",()=>{
  clearTimeout(st);
  const raw=$("q").value.trim().replace(/[,()%*]/g,"");
  if(raw.length<2){hideSugg();lastSugg=[];return}
  st=setTimeout(()=>suggest(raw),170);
});
$("q").addEventListener("keydown",e=>{
  const b=[...$("sugg").querySelectorAll("button")];
  if(!b.length||!$("sugg").classList.contains("open"))return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+b.length)%b.length;b.forEach((x,i)=>x.classList.toggle("act",i===sel))}
  else if(e.key==="Escape")hideSugg();
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))hideSugg()});
async function suggest(raw){
  const id=++reqId, up=clean(raw);
  const { data } = await sb.from("public_item_lookup").select("serial,display_name,status")
    .or(`serial.ilike.${up||"%"}%,display_name.ilike.%${raw}%`).limit(6);
  if(id!==reqId)return;
  lastSugg=data||[];
  if(!lastSugg.length){hideSugg();return}
  const box=$("sugg");
  box.innerHTML=lastSugg.map(r=>`<button type="button" role="option" data-s="${esc(r.serial)}">${tally(STATUS[r.status]||STATUS.idle)}<span class="t"><div class="s">${esc(r.serial)}</div><div class="n">${esc(r.display_name)}</div></span></button>`).join("");
  box.classList.add("open");sel=-1;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.s));
}

/* ---- Home + recent ---- */
function pushRecent(p){let r=(store("mlx-recent2")||[]).filter(x=>x.s!==p.serial);r.unshift({s:p.serial,n:p.display_name,t:p.status});store("mlx-recent2",r.slice(0,6))}
function home(){
  const r=store("mlx-recent2")||[];
  $("out").innerHTML=`<div class="home">
    <button class="bigscan rv" id="bigScan" aria-label="Scan a tag">${ic(IC.scan)}</button>
    <h1 class="rv" style="--r:1">Scan a tag to look it up</h1>
    <p class="rv" style="--r:2">Or type a serial number or item name above.</p>
    ${r.length?`<div class="rec rv" style="--r:3"><h2>Recent<button id="clr">Clear</button></h2>${r.map(x=>`<button class="ritem" data-s="${esc(x.s)}">${tally(STATUS[x.t]||STATUS.idle)}<span><div class="s">${esc(x.s)}</div><div class="n">${esc(x.n)}</div></span></button>`).join("")}</div>`:""}
  </div>`;
  $("bigScan").onclick=openScan;
  document.querySelectorAll(".ritem").forEach(b=>b.onclick=()=>go(b.dataset.s));
  if($("clr"))$("clr").onclick=()=>{store("mlx-recent2",[]);home()};
}

/* ---- Load & render ---- */
function checksumOk(s){
  if(s.length<8)return true;
  let sum=0;for(const c of s.slice(0,-1)){const v=ALPHA.indexOf(c);if(v<0)return false;sum+=v}
  return ALPHA[sum%32]===s.slice(-1);
}
function locChain(id,locs){const m=new Map(locs.map(l=>[l.id,l]));const out=[];let c=m.get(id),g=0;while(c&&g++<12){out.unshift(c.name);c=c.parent_id?m.get(c.parent_id):null}return out}
function skeleton(){
  $("out").innerHTML=`<div class="res"><div class="card hero"><div class="sk" style="aspect-ratio:4/3"></div><div class="sk" style="height:22px;width:40%;margin:18px 6px 10px"></div><div class="sk" style="height:32px;margin:0 6px"></div></div><div><div class="sk" style="height:48px;margin-bottom:14px"></div><div class="sk" style="height:130px;margin-bottom:12px"></div><div class="sk" style="height:100px"></div></div></div>`;
}
async function load(serial){
  currentSerial=serial;skeleton();
  const pub = await sb.from("public_item_lookup").select("*").eq("serial",serial).maybeSingle();
  if(serial!==currentSerial)return;
  if(pub.error){$("out").innerHTML=`<div class="card msg" style="margin-top:20px">Couldn't reach the gear database.<small>Check your connection and try again.</small></div>`;return}
  if(!pub.data){
    const hint=checksumOk(serial)?"":`<small>The check character doesn't match, so this serial may contain a typo.</small>`;
    $("out").innerHTML=`<div class="card msg rv" style="margin-top:20px">No item found for <b>${esc(serial)}</b>.${hint}<div class="acts" style="justify-content:center;margin-top:16px"><button class="btn" id="again">${ic(IC.scan)}Scan again</button></div></div>`;
    $("again").onclick=openScan;suggest(serial.slice(0,Math.max(3,serial.length-3)));return;
  }
  pushRecent(pub.data);
  const full = session ? await loadFull(serial) : null;
  if(serial!==currentSerial)return;
  render(pub.data,full);
}
async function loadFull(serial){
  try{
    const { data:it } = await sb.from("items").select("id,serial,unit_id,purchase_date,price,condition,notes,photo_url,status,location_id,last_serviced_date,next_service_due,warranty_expiry,created_at,model_registry(id,display_name,category,type,brand,model_code,spec_json)").eq("serial",serial).maybeSingle();
    if(!it)return null;
    const [locs,docs,bk] = await Promise.all([
      sb.from("locations").select("id,name,parent_id").then(r=>r.data||[]),
      sb.from("documents").select("title,file_url").eq("model_id",it.model_registry?.id ?? "").then(r=>r.data||[],()=>[]),
      sb.from("booking_event_items").select("packed,returned,booking_events(title,start_at,end_at)").eq("item_id",it.id).then(r=>r.data||[],()=>[])
    ]);
    return {it,path:locChain(it.location_id,locs),docs,bk};
  }catch(e){return null}
}

function render(p,f){
  const it=f?.it||{}, S=STATUS[p.status]||STATUS.idle, cat=CAT[p.category]||["📦",p.category||"Item"];
  const photo=safeUrl(p.photo_url||it.photo_url);
  const path=f?.path?.length?f.path:(p.location_path?String(p.location_path).split(/\s*[›>\/]\s*/).filter(Boolean):[]);
  const spec=Object.entries(p.spec_json||{}).filter(([,v])=>v!==null&&v!=="");
  const pubNote=p.public_note||p.notes;
  const chips=[`<span class="chip">${cat[0]} ${esc(cat[1])}</span>`];
  if(p.condition||it.condition)chips.push(`<span class="chip">${esc(p.condition||it.condition)}</span>`);
  if(it.warranty_expiry){const d=days(it.warranty_expiry);chips.push(`<span class="chip ${d<0?"bad":d<60?"warn":"ok"}">${d<0?"Warranty expired":"Warranty to "+fmtDate(it.warranty_expiry)}</span>`)}
  if(it.next_service_due){const d=days(it.next_service_due);if(d<60)chips.push(`<span class="chip ${d<0?"bad":"warn"}">${d<0?"Service overdue":"Service due "+fmtDate(it.next_service_due)}</span>`)}

  const tabs=[["ov","Overview"]]; if(spec.length)tabs.push(["sp","Specs"]); tabs.push(["tg","Tag"],["dt","Details"]);
  if(!tabs.some(t=>t[0]===tab))tab="ov";

  const c=CONTACT, mail=c.email?`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent("Found item "+p.serial)}&body=${encodeURIComponent("I found "+(p.display_name||"an item")+" ("+p.serial+").\nWhere: ")}`:"";
  const where = path.length
    ? `<ol class="steps">${path.map((x,i)=>`<li class="${i===path.length-1?"cur":""}" style="--d:${i}"><span class="nd"></span>${esc(x)}</li>`).join("")}</ol>`
    : `<div class="empty">${session?"No storage location set.":p.status==="idle"?"Not currently assigned.":"Currently "+esc(S.l.toLowerCase())+"."}</div>`;
  const ov=`<div class="card"><h3>Where it is</h3>${where}</div>`
    +((pubNote||it.notes)?`<div class="card"><h3>Notes</h3>${pubNote?`<div class="note">${esc(pubNote)}</div>`:""}${it.notes&&it.notes!==pubNote?`<div class="note" ${pubNote?'style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"':""}>${esc(it.notes)}</div>`:""}</div>`:"")
    +`<div class="card found"><h3>Found this item?</h3><p>This belongs to ${esc(COMPANY)}. Please get in touch so it can be returned. Thank you!</p><div class="acts">${mail?`<a class="btn" href="${mail}">Email us</a>`:""}${c.phone?`<a class="btn" href="tel:${esc(c.phone.replace(/\s/g,""))}">Call</a>`:""}${c.web?`<a class="btn g" href="${safeUrl(c.web)}">Website</a>`:""}</div></div>`;
  const sp=`<div class="card"><h3>Specs</h3>${spec.map(([k,v])=>`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>`;
  const tg=`<div class="card"><div class="tag"><b>${esc(COMPANY)}</b><div id="qr"></div><svg id="bar"></svg><span class="m">${esc(p.serial)}</span></div><div class="acts noprint" style="margin-top:14px"><button class="btn g" id="prt">${ic(IC.print)}Print label</button></div></div>`;
  let dt="";
  if(f){
    const m=it.model_registry||{};
    const rows=[["Model code",m.model_code],["Unit",it.unit_id],["Purchased",fmtDate(it.purchase_date)],["Price",fmtMoney(it.price)],["Last serviced",fmtDate(it.last_serviced_date)],["Next service",fmtDate(it.next_service_due)],["Warranty until",fmtDate(it.warranty_expiry)],["Added",fmtDate(it.created_at)]].filter(r=>r[1]);
    dt=`<div class="card"><h3>Full details</h3>${rows.length?rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join(""):'<div class="empty">Nothing recorded yet.</div>'}</div>`;
    const bks=f.bk.filter(b=>b.booking_events).sort((a,b)=>new Date(b.booking_events.start_at)-new Date(a.booking_events.start_at)).slice(0,6);
    if(bks.length)dt+=`<div class="card"><h3>Bookings</h3>${bks.map(b=>`<div class="row"><span>${esc(b.booking_events.title)}</span><span class="v" style="color:var(--tx3)">${fmtDate(b.booking_events.start_at)}${b.returned?" · returned":b.packed?" · packed":""}</span></div>`).join("")}</div>`;
    if(f.docs.length)dt+=`<div class="card"><h3>Documents</h3>${f.docs.map(d=>`<div class="row"><span>${d.file_url?`<a href="${safeUrl(d.file_url)}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:700">${esc(d.title)}</a>`:esc(d.title)}</span></div>`).join("")}</div>`;
    if(role&&role!=="guest")dt+=`<a class="btn g" href="${DASH_URL}">Open in dashboard</a>`;
  } else dt=`<div class="card lock">${ic(IC.lock)}<p>Purchase details, service history, bookings and documents are visible to the MLX crew.</p><button class="btn" id="lockBtn">Sign in</button></div>`;
  const panels={ov,sp,tg,dt};

  $("out").innerHTML=`<div class="res">
   <div class="card hero rv">
    <div class="vf">${photo?`<img src="${photo}" alt="${esc(p.display_name)}">`:`<div class="ph">${cat[0]}</div>`}<i></i><i></i><i></i><i></i>
      <div class="stat">${tally(S)}${S.l}</div></div>
    <div class="hd">
      <div class="sn"><span>${esc(p.serial)}</span><button id="cpy" aria-label="Copy serial">${ic(IC.copy)}</button></div>
      <div class="nm">${esc(p.display_name||"Unknown item")}</div>
      <div class="chips">${chips.join("")}</div>
      <div class="acts"><button class="btn g" id="shr">${ic(IC.share)}Share</button><button class="btn g" id="scanAgain">${ic(IC.scan)}Scan another</button></div>
    </div>
   </div>
   <div class="rv" style="--r:2">
    <div class="tabs" id="tabs" style="--n:${tabs.length};--i:${tabs.findIndex(t=>t[0]===tab)}">${tabs.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}${t[0]==="dt"&&!f?ic(IC.lock):""}</button>`).join("")}</div>
    ${tabs.map(t=>`<div class="pn ${t[0]===tab?"on":""}" id="p-${t[0]}">${panels[t[0]]}</div>`).join("")}
   </div></div>`;

  document.querySelectorAll("#tabs button").forEach((b,i)=>b.onclick=()=>{
    tab=b.dataset.t;$("tabs").style.setProperty("--i",i);
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
    document.querySelectorAll(".pn").forEach(x=>x.classList.toggle("on",x.id==="p-"+tab));
  });
  try{new QRCode($("qr"),{text:location.origin+location.pathname+"?s="+p.serial,width:132,height:132,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  try{JsBarcode("#bar",p.serial,{format:"CODE128",lineColor:"#000",width:1.7,height:54,displayValue:false,margin:0})}catch(e){}
  $("cpy").onclick=()=>navigator.clipboard?.writeText(p.serial).then(()=>toast("Serial copied"));
  $("shr").onclick=async()=>{const u=location.origin+location.pathname+"?s="+p.serial;if(navigator.share){try{await navigator.share({title:p.display_name,url:u})}catch(e){}}else{navigator.clipboard?.writeText(u);toast("Link copied")}};
  $("scanAgain").onclick=openScan;
  $("prt").onclick=()=>{document.body.classList.add("pt");print()};
  if($("lockBtn"))$("lockBtn").onclick=openAcct;
  document.title=p.serial+" · MLX Gear";
}
window.addEventListener("afterprint",()=>document.body.classList.remove("pt"));

/* ---- Account ---- */
function openAcct(){
  const P=$("acctPanel");
  P.innerHTML=session
   ?`<h3>Signed in</h3><p style="color:var(--tx2);margin-bottom:16px;overflow-wrap:anywhere">${esc(session.user.email)}<br>Role: ${esc(role||"guest")}</p><button class="btn" id="so">Sign out</button><button class="btn g" style="margin-top:8px" id="cx">Close</button>`
   :`<h3>Sign in to MLX Gear</h3><input id="em" type="email" placeholder="Email" autocomplete="username" inputmode="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="err" id="authErr"></div><button class="btn" id="authGo">Sign in</button><button class="btn g" style="margin-top:8px" id="cx">Cancel</button>`;
  $("acctSheet").classList.add("open");
  $("cx").onclick=closeAcct;
  if(session)$("so").onclick=async()=>{await sb.auth.signOut();closeAcct()};
  else{
    setTimeout(()=>$("em").focus(),300);
    $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("authGo").click()});
    $("authGo").onclick=async()=>{
      $("authErr").textContent="";$("authGo").disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
      $("authGo").disabled=false;
      if(error)$("authErr").textContent="Wrong email or password.";else{tab="dt";closeAcct()}
    };
  }
}
function closeAcct(){$("acctSheet").classList.remove("open")}
$("acctSheet").onclick=e=>{if(e.target===$("acctSheet"))closeAcct()};
$("acctBtn").onclick=openAcct;
async function setSession(s){
  session=s;role=null;
  if(s){const r=await sb.from("user_roles").select("role").eq("user_id",s.user.id).maybeSingle();role=r.data?.role||"guest"}
  const b=$("acctBtn");
  if(s){b.className="ib av";b.textContent=(s.user.email||"?")[0].toUpperCase();b.setAttribute("aria-label","Account")}
  else{b.className="ib";b.textContent="Sign in"}
  if(currentSerial)load(currentSerial);
}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setSession(s)});

/* ---- Theme ---- */
function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark")}
function themeIcon(){$("themeBtn").innerHTML=ic(curTheme()==="dark"?IC.sun:IC.moon)}
$("themeBtn").onclick=()=>{const nx=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("mlx-gear-theme",nx)}catch(e){};themeIcon()};
themeIcon();

/* ---- Scanner: native BarcodeDetector, ZXing fallback (iPhone/Safari/Firefox), photo fallback ---- */
let stream=null,scanOn=false,zxr=null,done=false;
const hint=t=>$("hint").textContent=t;
function loadZX(){return window.ZXing?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseCode(v){try{const u=new URL(v);v=u.searchParams.get("s")||u.searchParams.get("serial")||u.hash.slice(1)||u.pathname.split("/").filter(Boolean).pop()||v}catch(e){}return v}
function hit(raw){
  if(done)return;done=true;navigator.vibrate?.(60);$("frame").classList.add("ok");hint("Found it");
  setTimeout(()=>{closeScan();go(parseCode(raw))},380);
}
async function openScan(){
  done=false;$("frame").classList.remove("ok");$("scanov").classList.add("open");hint("Starting camera…");
  if(!navigator.mediaDevices?.getUserMedia){hint("Camera isn't available here. Use a photo instead.");return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}}});
    const v=$("vid");v.srcObject=stream;await v.play();scanOn=true;hint("Point at a QR code or barcode");
    const tr=stream.getVideoTracks()[0];$("torch").hidden=!(tr.getCapabilities&&tr.getCapabilities().torch);
    if("BarcodeDetector" in window){
      const det=new BarcodeDetector({formats:["qr_code","code_128"]});
      (async function tick(){if(!scanOn)return;try{const r=await det.detect(v);if(r[0])return hit(r[0].rawValue)}catch(e){}setTimeout(tick,180)})();
    }else{
      await loadZX();if(!scanOn)return;
      zxr=new ZXing.BrowserMultiFormatReader();
      zxr.decodeFromVideoElement(v).then(r=>hit(r.getText())).catch(()=>{});
    }
  }catch(e){hint("Camera blocked. Allow access, or use a photo instead.")}
}
function closeScan(){
  scanOn=false;try{zxr&&zxr.reset()}catch(e){}zxr=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("vid").srcObject=null;$("scanov").classList.remove("open");
}
let torchOn=false;
$("torch").onclick=async()=>{try{torchOn=!torchOn;await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]})}catch(e){}};
$("scanBtn").onclick=openScan;$("scClose").onclick=closeScan;
$("photoIn").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;hint("Reading photo…");
  try{
    if("BarcodeDetector" in window){const r=await new BarcodeDetector({formats:["qr_code","code_128"]}).detect(await createImageBitmap(file));if(r[0])return hit(r[0].rawValue)}
    else{await loadZX();const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(file));return hit(r.getText())}
  }catch(err){}
  hint("No code found in that photo. Try again closer.");
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeScan();closeAcct()}});

/* ---- Init ---- */
const first=serialFromUrl();
if(first){$("q").value=first;load(first)}else home();
</script>
